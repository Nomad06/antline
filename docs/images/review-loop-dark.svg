<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-label="antline review loop: every reviewer remark gets exactly one outcome"><title>antline review loop: every reviewer remark gets exactly one outcome</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#e6edf3}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}.muted{fill:#9198a1}.h{font-size:15px;font-weight:600}.cap{font-size:11.5px}.t{font-size:13.5px;font-weight:600}.s{font-size:11.5px}.xs{font-size:10.5px}.panel{fill:#151b23;stroke:#3d444d;stroke-width:1}.arrow{stroke:#6e7681;stroke-width:1.6;fill:none}.dash{stroke-dasharray:4 4}.head{fill:#6e7681}.model{fill:#0c2d6b;stroke:#388bfd;stroke-width:1.2}.model-t{fill:#cae8ff}.code{fill:#0f3d22;stroke:#2ea043;stroke-width:1.2}.code-t{fill:#aff5b4}.human{fill:#3b2e0a;stroke:#bb8009;stroke-width:1.2}.human-t{fill:#f8e3a1}.deny{fill:#4c1419;stroke:#f85149;stroke-width:1.2}.deny-t{fill:#ffdcd7}.guard{fill:#2e1c4d;stroke:#a371f7;stroke-width:1.2}.guard-t{fill:#e2d1ff}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs><rect x="10" y="6" width="900" height="288" rx="10" class="panel"/><rect x="30" y="108" width="150" height="74" rx="8" class="human"/><text x="42" y="135" class="t human-t" text-anchor="start">Reviewer remark</text><text x="42" y="151" class="s human-t" text-anchor="start">a new note on</text><text x="42" y="166" class="s human-t" text-anchor="start">the merge request</text><rect x="212" y="108" width="170" height="74" rx="8" class="code"/><text x="224" y="135" class="t code-t" text-anchor="start">ppl review pending</text><text x="224" y="151" class="s code-t" text-anchor="start">drops resolved, own and</text><text x="224" y="166" class="s code-t" text-anchor="start">already answered threads</text><rect x="414" y="108" width="150" height="74" rx="8" class="model"/><text x="426" y="135" class="t model-t" text-anchor="start">Review responder</text><text x="426" y="151" class="s model-t" text-anchor="start">classifies the remark,</text><text x="426" y="166" class="s model-t" text-anchor="start">drafts the reply</text><path d="M182,145 L210,145" class="arrow" marker-end="url(#ah)"/><path d="M382,145 L412,145" class="arrow" marker-end="url(#ah)"/><rect x="610" y="22" width="290" height="50" rx="8" class="model"/><text x="622" y="43" class="t mono model-t" text-anchor="start">NEEDS_CODE_CHANGE</text><text x="622" y="60" class="xs model-t" text-anchor="start">code → tests → gates → verifier again, new SHA</text><path d="M564,145 C590,145 584,47 608,47" class="arrow" marker-end="url(#ah)"/><rect x="610" y="84" width="290" height="50" rx="8" class="model"/><text x="622" y="105" class="t mono model-t" text-anchor="start">NEEDS_REPLY_ONLY</text><text x="622" y="122" class="xs model-t" text-anchor="start">a reply that cites file:line or a receipt</text><path d="M564,145 C590,145 584,109 608,109" class="arrow" marker-end="url(#ah)"/><rect x="610" y="146" width="290" height="50" rx="8" class="human"/><text x="622" y="167" class="t mono human-t" text-anchor="start">DISAGREE</text><text x="622" y="184" class="xs human-t" text-anchor="start">drafts the counter-argument, asks you first</text><path d="M564,145 C590,145 584,171 608,171" class="arrow" marker-end="url(#ah)"/><rect x="610" y="208" width="290" height="50" rx="8" class="human"/><text x="622" y="229" class="t mono human-t" text-anchor="start">NEEDS_OWNER</text><text x="622" y="246" class="xs human-t" text-anchor="start">scope or design decision: parks and asks you</text><path d="M564,145 C590,145 584,233 608,233" class="arrow" marker-end="url(#ah)"/><text x="30" y="232" class="s muted" text-anchor="start">Replies are posted by the orchestrator. No agent resolves a thread, approves or merges:</text><text x="30" y="250" class="s muted" text-anchor="start">the remark's author resolves it and a human merges. The run is done when an approval sits</text><text x="30" y="268" class="s muted" text-anchor="start">on the current head SHA, and a new commit makes the old approval stale.</text></svg>
