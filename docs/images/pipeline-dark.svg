<svg xmlns="http://www.w3.org/2000/svg" width="920" height="576" viewBox="0 0 920 576" role="img" aria-label="antline pipeline: from a tracker issue to an approved merge request"><title>antline pipeline: from a tracker issue to an approved merge request</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#e6edf3}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}.muted{fill:#9198a1}.h{font-size:15px;font-weight:600}.cap{font-size:11.5px}.t{font-size:13.5px;font-weight:600}.s{font-size:11.5px}.xs{font-size:10.5px}.panel{fill:#151b23;stroke:#3d444d;stroke-width:1}.arrow{stroke:#6e7681;stroke-width:1.6;fill:none}.dash{stroke-dasharray:4 4}.head{fill:#6e7681}.model{fill:#0c2d6b;stroke:#388bfd;stroke-width:1.2}.model-t{fill:#cae8ff}.code{fill:#0f3d22;stroke:#2ea043;stroke-width:1.2}.code-t{fill:#aff5b4}.human{fill:#3b2e0a;stroke:#bb8009;stroke-width:1.2}.human-t{fill:#f8e3a1}.deny{fill:#4c1419;stroke:#f85149;stroke-width:1.2}.deny-t{fill:#ffdcd7}.guard{fill:#2e1c4d;stroke:#a371f7;stroke-width:1.2}.guard-t{fill:#e2d1ff}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs><rect x="10" y="10" width="208.5" height="366" rx="10" class="panel"/><text x="22" y="36" class="h" text-anchor="start">1  Understand</text><text x="22" y="54" class="cap muted" text-anchor="start">what exactly is asked</text><rect x="240.5" y="10" width="208.5" height="366" rx="10" class="panel"/><text x="252.5" y="36" class="h" text-anchor="start">2  Build</text><text x="252.5" y="54" class="cap muted" text-anchor="start">two agents, two contexts</text><rect x="471" y="10" width="208.5" height="366" rx="10" class="panel"/><text x="483" y="36" class="h" text-anchor="start">3  Prove</text><text x="483" y="54" class="cap muted" text-anchor="start">evidence, not self-report</text><rect x="701.5" y="10" width="208.5" height="366" rx="10" class="panel"/><text x="713.5" y="36" class="h" text-anchor="start">4  Ship</text><text x="713.5" y="54" class="cap muted" text-anchor="start">until a human approves</text><rect x="20" y="68" width="188.5" height="58" rx="8" class="model"/><text x="32" y="87" class="t model-t" text-anchor="start">Admission</text><text x="32" y="103" class="s model-t" text-anchor="start">issue + linked spec,</text><text x="32" y="118" class="s model-t" text-anchor="start">10-point checklist</text><rect x="20" y="142" width="188.5" height="58" rx="8" class="code"/><text x="32" y="161" class="t code-t" text-anchor="start">Baseline</text><text x="32" y="177" class="s code-t" text-anchor="start">base SHA + gate results</text><text x="32" y="192" class="s code-t" text-anchor="start">before any change</text><rect x="20" y="216" width="188.5" height="58" rx="8" class="model"/><text x="32" y="235" class="t model-t" text-anchor="start">Brief</text><text x="32" y="251" class="s model-t" text-anchor="start">acceptance IDs and the</text><text x="32" y="266" class="s model-t" text-anchor="start">write boundary</text><rect x="20" y="290" width="188.5" height="58" rx="8" class="model"/><text x="32" y="309" class="t model-t" text-anchor="start">Brief challenge</text><text x="32" y="325" class="s model-t" text-anchor="start">a second agent must</text><text x="32" y="340" class="s model-t" text-anchor="start">ACCEPT it to go on</text><path d="M114.25,127 L114.25,140" class="arrow" marker-end="url(#ah)"/><path d="M114.25,201 L114.25,214" class="arrow" marker-end="url(#ah)"/><path d="M114.25,275 L114.25,288" class="arrow" marker-end="url(#ah)"/><rect x="250.5" y="68" width="188.5" height="58" rx="8" class="model"/><text x="262.5" y="87" class="t model-t" text-anchor="start">Code worker</text><text x="262.5" y="103" class="s model-t" text-anchor="start">edits product code inside</text><text x="262.5" y="118" class="s model-t" text-anchor="start">the write boundary only</text><rect x="250.5" y="172" width="188.5" height="58" rx="8" class="model"/><text x="262.5" y="191" class="t model-t" text-anchor="start">Test worker</text><text x="262.5" y="207" class="s model-t" text-anchor="start">writes tests from the brief,</text><text x="262.5" y="222" class="s model-t" text-anchor="start">cannot read the code</text><line x1="248.5" y1="149" x2="441" y2="149" class="arrow dash"/><text x="344.75" y="144" class="xs muted" text-anchor="middle">no shared context</text><rect x="250.5" y="276" width="188.5" height="72" rx="8" class="panel"/><text x="262.5" y="296" class="s muted" text-anchor="start">Runs in its own git worktree,</text><text x="262.5" y="311" class="s muted" text-anchor="start">your checkout stays untouched.</text><text x="262.5" y="326" class="s muted" text-anchor="start">Every tool call meets the</text><text x="262.5" y="341" class="s muted" text-anchor="start">guard hook first.</text><rect x="481" y="68" width="188.5" height="58" rx="8" class="code"/><text x="493" y="87" class="t code-t" text-anchor="start">Deterministic gates</text><text x="493" y="103" class="s code-t" text-anchor="start">compile, lint, tests vs</text><text x="493" y="118" class="s code-t" text-anchor="start">baseline, receipt per SHA</text><rect x="481" y="142" width="188.5" height="58" rx="8" class="model"/><text x="493" y="161" class="t model-t" text-anchor="start">Verifier</text><text x="493" y="177" class="s model-t" text-anchor="start">read-only, proof for</text><text x="493" y="192" class="s model-t" text-anchor="start">every acceptance ID</text><path d="M575.25,127 L575.25,140" class="arrow" marker-end="url(#ah)"/><rect x="481" y="276" width="188.5" height="72" rx="8" class="panel"/><text x="493" y="296" class="s muted" text-anchor="start">A red gate inside the boundary</text><text x="493" y="311" class="s muted" text-anchor="start">means rework. A red gate</text><text x="493" y="326" class="s muted" text-anchor="start">outside it parks the run and</text><text x="493" y="341" class="s muted" text-anchor="start">asks you.</text><rect x="711.5" y="68" width="188.5" height="58" rx="8" class="model"/><text x="723.5" y="87" class="t model-t" text-anchor="start">Merge request</text><text x="723.5" y="103" class="s model-t" text-anchor="start">criteria + evidence,</text><text x="723.5" y="118" class="s model-t" text-anchor="start">GitLab or GitHub</text><rect x="711.5" y="142" width="188.5" height="58" rx="8" class="model"/><text x="723.5" y="161" class="t model-t" text-anchor="start">Review loop</text><text x="723.5" y="177" class="s model-t" text-anchor="start">fix, reply or ask you,</text><text x="723.5" y="192" class="s model-t" text-anchor="start">never resolves a thread</text><rect x="711.5" y="216" width="188.5" height="58" rx="8" class="human"/><text x="723.5" y="235" class="t human-t" text-anchor="start">Approval</text><text x="723.5" y="251" class="s human-t" text-anchor="start">by a reviewer, bound</text><text x="723.5" y="266" class="s human-t" text-anchor="start">to the current head SHA</text><rect x="711.5" y="290" width="188.5" height="58" rx="8" class="code"/><text x="723.5" y="309" class="t code-t" text-anchor="start">Done gate</text><text x="723.5" y="325" class="s code-t" text-anchor="start">7 checks on the head SHA,</text><text x="723.5" y="340" class="s code-t" text-anchor="start">then you merge</text><path d="M805.75,127 L805.75,140" class="arrow" marker-end="url(#ah)"/><path d="M805.75,201 L805.75,214" class="arrow" marker-end="url(#ah)"/><path d="M805.75,275 L805.75,288" class="arrow" marker-end="url(#ah)"/><path d="M210.5,97 L248.5,97" class="arrow" marker-end="url(#ah)"/><path d="M441,97 L479,97" class="arrow" marker-end="url(#ah)"/><path d="M671.5,97 L709.5,97" class="arrow" marker-end="url(#ah)"/><path d="M440,201 C469,201 451,107 479,107" class="arrow" marker-end="url(#ah)"/><path d="M480,171 L460,171 L460,398 L409,398 L409,378" class="arrow dash" marker-end="url(#ah)"/><text x="468" y="392" class="xs muted" text-anchor="start">verifier finding: rework, 3 rounds at most</text><path d="M710.5,171 L690.5,171 L690.5,422 L280.5,422 L280.5,378" class="arrow dash" marker-end="url(#ah)"/><text x="525.5" y="437" class="xs muted" text-anchor="middle">a remark that needs code: the whole loop runs again on a new SHA</text><rect x="10" y="452" width="900" height="40" rx="8" class="guard"/><text x="22" y="477" class="t guard-t" text-anchor="start">Guard hook</text><text x="118" y="477" class="s guard-t" text-anchor="start">every tool call of every agent is checked: write boundary, read isolation, no merge, no thread resolve</text><rect x="10" y="500" width="900" height="40" rx="8" class="code"/><text x="22" y="525" class="t code-t" text-anchor="start">ppl state machine</text><text x="162" y="525" class="s code-t" text-anchor="start">stages move only when the artifacts allow it, state survives a crash, ppl recover resumes</text><rect x="14" y="553" width="14" height="14" rx="3" class="model"/><text x="34" y="564" class="s muted" text-anchor="start">Claude Code agent</text><rect x="160.2" y="553" width="14" height="14" rx="3" class="code"/><text x="180.2" y="564" class="s muted" text-anchor="start">deterministic code</text><rect x="313" y="553" width="14" height="14" rx="3" class="human"/><text x="333" y="564" class="s muted" text-anchor="start">a human</text><rect x="393.2" y="553" width="14" height="14" rx="3" class="guard"/><text x="413.2" y="564" class="s muted" text-anchor="start">the cage</text></svg>
