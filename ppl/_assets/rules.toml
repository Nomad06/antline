[[rule]]
id = "R-TEST-WORKER-BASH-READS"
statement = "A ppl-test-worker Bash command is denied unless every segment of it is one of a small set of shapes the role is derived to need - the build/test shapes the run's harness snapshot declares, the echo used by its rc-file idiom, git status/add (test paths only)/commit, ls, and reading a test source with cat, head, tail, grep or rg using only the options the guard classifies, never one whose value names a file (grep -f/--file/--exclude-from, rg -f/--file/--ignore-file), test paths and sources being those the run's test patterns (snapshot `[tests]`, Java defaults when absent) match. sed, awk and less are no read verbs: their scripts and commands read, write or run files the guard never sees. Anything else denies, an option the guard does not classify and a shape the hook cannot parse included. A command or process substitution anywhere in the command - $(, a backtick, <( or >( - denies the whole command before any segment is looked at. A read-verb or git add path the shell would rewrite - a brace, a parenthesis, $ or a backtick, a leading = or ~user, a .. segment, or a glob segment starting with . or [ - is unclassifiable and denies, naming the shell expansion, and so does any other word after a read verb (a pattern, an option, its value) holding a $ or a backtick, an unquoted brace, group or glob, or a leading unquoted ~ or =. An export, or a build shape's env prefix, setting IFS, GREP_OPTIONS or RIPGREP_CONFIG_PATH denies."
