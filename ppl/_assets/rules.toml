residual = ""

[[rule]]
id = "R-DONE-ACCEPTANCE-EVIDENCE"
statement = "Done condition 3: every acceptance id has a passing receipt on the candidate SHA."
scope = "ppl CLI"
event = "ppl transition done"
enforcement = "blocking"
hook_or_check = "ppl/verdict.py:_proven, ppl/verdict.py:done_blockers"
deny_test = "tests/test_verdict.py::TestVerdict::test_done_blocked_when_acceptance_lacks_evidence"
allow_test = "tests/test_verdict.py::TestVerdict::test_done_allowed_when_everything_holds"
