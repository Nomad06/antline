[[rule]]
id = "R-FINDINGS-TRACK-DERIVED"
statement = "ppl findings add derives whether a finding is own_diff or foreign from gitfacts.changed_paths(base_sha, affected_sha), never from a caller-supplied argument - there is no track parameter to accept one through, so a third box cannot be introduced by passing one in."
scope = "ppl CLI"
event = "ppl findings add"
enforcement = "blocking"
hook_or_check = "ppl/findings.py:add, ppl/findings.py:_derive_track"
deny_test = "tests/test_findings.py::TestTrackIsDerivedNotAccepted::test_add_has_no_track_parameter_to_pass"
allow_test = "tests/test_findings.py::TestTrackIsDerivedNotAccepted::test_a_path_touched_by_the_diff_is_own_diff, tests/test_findings.py::TestTrackIsDerivedNotAccepted::test_a_path_the_diff_never_touched_is_foreign"
owner = "ppl"
residual = "changed_paths compares the literal path string; a rename that changes a file's path between base_sha and affected_sha without otherwise touching its content is diffed as delete+add by git, which changed_paths still lists, so this is not a gap - but a caller who reports the pre-rename path for a finding filed against the post-rename tree would be misclassified. Not exercised because ppl findings add is always called about the tree at affected_sha, where the current path is the only one known"

