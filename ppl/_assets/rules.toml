owner = "guard-hook"
residual = "the floor runs only if the file parses and the floor module imports: each hook appends its own directory to sys.path, so PYTHONSAFEPATH, -P and -I do not hide it, and every hook and ppl/_assets/hooks/ppl_python_floor.py are kept to Python 3.9 syntax, and the subprocess test proves that on a machine with an older python3 at /usr/bin/python3 and skips elsewhere, and CI's python-floor job runs every hook and bin/ppl under Python 3.9 on every push. SubagentStart cannot block (R-DISPATCH-HOOK-CANNOT-BLOCK), so the dispatch hook's deny is informational, and the usage hook's deny is no SubagentStop decision either (R-USAGE-HOOK-CANNOT-BLOCK). ppl setup claude pins the interpreter that ran it, so the floor fires for a hand-written or stale entry; ppl doctor's hook_runs runs each registered guard command once and reports false when it does not exit 0 cleanly"

[[rule]]
id = "R-RUNS-WRITE-PROTECTION"
statement = "A file write under runs/ made through Edit, Write, MultiEdit or NotebookEdit, its path resolved against the session cwd and through symlinks, is denied for every session, with control.json as the only carve-out; a Bash write is a separate, narrower check - see R-RUNS-BASH-WRITE."
scope = "global, no run required"
event = "PreToolUse on Edit/Write/MultiEdit/NotebookEdit"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:decide, ppl/_assets/hooks/ppl_guard.py:structured_write_lands_in_runs"
deny_test = "tests/test_guard.py::TestGuard::test_writing_state_json_directly_is_denied, tests/test_guard.py::TestGuard::test_writing_evilcontrol_json_is_denied, tests/test_guard.py::TestGuard::test_structured_write_into_runs_through_a_symlinked_alias_is_denied, tests/test_guard.py::TestGuard::test_structured_write_into_runs_relative_to_the_session_cwd_is_denied"
allow_test = "tests/test_guard.py::TestGuard::test_writing_control_json_is_allowed"
owner = "guard-hook"
residual = "the carve-out is by file name, so any path under runs/ named control.json is writable. This row's own statement used to read 'denied for every tool and every role' - false the moment a Bash write is considered: whole-branch review Warning 7 drove `python3 -c \"open('<runs>/<task>/state.json','w').write('{}')\"` through the real hook from ppl-code-worker and it was ALLOWED, because R-RUNS-BASH-WRITE's own regex (redirect/tee/sed -i/cp/mv/dd/rm) does not model an interpreter invocation - that row's residual already said so honestly, this one's statement did not. Chasing python3 -c specifically would not close the class either (perl -e, ruby -e, node -e reach the same result), so the statement is corrected to say what is actually checked rather than widen the regex for a false sense of completeness - same reasoning as R-GUARD-BASH-WRITE-BOUNDARY and R-GUARD-PPL-CLI-DENIED's quote-splitting residual"

[[rule]]
id = "R-RUNS-BASH-WRITE"
statement = "A Bash command with a write-shaped construct whose resolved target lands under the runs directory (spelled absolute, with ~, after a cd, pushd or popd, through a ( subshell or a { group, behind env -C or a wrapper verb - command, builtin, exec, nohup, nice, time, each read by its basename when spelled by a path - with the redirect glued or spaced, relative to the session cwd or through a symlinked alias), or a removal that holds it (rm -rf ~/.ppl, mv ~/.ppl x), or a copy or move into a directory that places a source's own name on runs/ or its parent (cp -r x/runs ~/.ppl - a copy into ~ under any other name writes beside runs/), is denied for every session, and so is one that names the runs directory literally together with a write-shaped construct. A redirect after a group's ) or } is judged in the cwd the group opened in, and a bare & ends a command as ; does. control.json, the operator's inbox, is spared for the unroled operator session alone: for a role in boundary.ROLE_RULES it is denied like any other run file."
scope = "global, no run required"
event = "PreToolUse on Bash"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:BASH_WRITE_SHAPES, ppl/_assets/hooks/ppl_guard.py:bash_write_lands_in_runs, ppl/_assets/hooks/ppl_guard.py:decide"
deny_test = "tests/test_guard.py::TestGuard::test_bash_redirect_into_runs_dir_is_denied, tests/test_guard.py::TestGuard::test_bash_tee_into_runs_dir_is_denied, tests/test_guard.py::TestGuard::test_bash_sed_inplace_on_runs_dir_is_denied, tests/test_guard.py::TestGuard::test_tilde_spelled_bash_write_into_runs_is_denied_for_every_caller, tests/test_guard.py::TestGuard::test_cd_relative_bash_write_into_runs_is_denied_for_every_caller, tests/test_guard.py::TestGuard::test_bash_write_into_runs_with_no_active_run_is_still_denied, tests/test_guard.py::TestGuard::test_home_variable_spelling_is_denied_for_a_role_by_the_unresolvable_target_rule, tests/test_guard.py::TestGuard::test_a_role_gets_no_control_json_carve_out_in_bash, tests/test_guard.py::TestGuard::test_a_subshell_brace_group_pushd_or_env_cd_into_runs_is_followed, tests/test_guard.py::TestGuard::test_a_clobber_redirect_is_a_redirect, tests/test_guard.py::TestGuard::test_removing_or_moving_a_parent_of_runs_is_denied, tests/test_guard.py::TestGuard::test_a_wrapper_in_front_of_a_write_verb_is_unwrapped, tests/test_guard.py::TestGuard::test_the_wrapper_unwrap_stays_linear, tests/test_guard.py::TestGuard::test_a_redirect_on_a_cd_into_runs_is_denied_for_every_caller, tests/test_guard.py::TestGuard::test_a_quoted_paren_does_not_close_the_subshell, tests/test_guard.py::TestGuard::test_popd_on_an_empty_stack_keeps_the_directory, tests/test_guard.py::TestGuard::test_a_removal_that_takes_runs_with_it_is_still_denied, tests/test_guard.py::TestGuard::test_a_path_spelled_verb_or_wrapper_is_read_by_its_name, tests/test_guard.py::TestGuard::test_a_redirect_glued_to_a_word_into_runs_is_denied, tests/test_guard.py::TestGuard::test_a_group_redirect_into_runs_with_no_active_run_is_denied, tests/test_guard.py::TestGuard::test_a_closed_group_into_runs_gives_its_cwd_back_for_every_caller, tests/test_guard.py::TestGuard::test_a_bare_ampersand_does_not_hide_a_runs_write, tests/test_guard.py::TestGuard::test_a_copy_whose_own_name_lands_on_runs_is_denied"
allow_test = "tests/test_guard.py::TestGuard::test_bash_read_of_runs_dir_is_allowed, tests/test_guard.py::TestGuard::test_tilde_spelled_bash_write_to_control_json_is_allowed_for_the_operator, tests/test_guard.py::TestGuard::test_tilde_spelled_bash_write_under_the_data_root_but_outside_runs_is_allowed, tests/test_guard.py::TestGuard::test_writing_beside_runs_under_the_data_root_is_allowed, tests/test_guard.py::TestGuard::test_a_wrapped_command_elsewhere_is_still_allowed, tests/test_guard.py::TestGuard::test_a_copy_into_a_parent_of_runs_is_allowed, tests/test_guard.py::TestGuard::test_the_cd_and_grouping_walk_stays_linear, tests/test_guard.py::TestGuard::test_a_group_redirect_after_a_cd_into_runs_opens_outside_it"
owner = "guard-hook"
residual = "the global check resolves literal, ~, cd-relative (cd, pushd and popd - popd on an empty stack keeps the cwd - a ( subshell cd that ends at its ), a { group cd, and env -C/--chdir for the command env runs) and payload-relative spellings, for every caller, with env, command, builtin, exec, nohup, nice (-n N, -nN, -N) and time (-p) unwrapped, nested ones too, and a verb or wrapper spelled by a path read by its basename; a cd behind command, builtin or time moves the shell, one behind exec, nohup, nice or env, or one spelled by a path, does not, and a wrapper option this does not know fails closed like an unresolvable target. Grouping and redirects are read off the raw segment text outside quotes, so a quoted ) does not close a subshell, a quoted > (grep \">x\", awk '$1>2') is not a target, and a word-glued redirect (echo x>f, x>|f) is; a cd's own redirect opens in the pre-cd cwd. A redirect after a group's ) or } ((cd d && echo x) > f, { cd d; echo x; } > f) opens in the cwd the group opened in and nested groups unwind one at a time. A tail that also holds a word that is neither a closer nor a redirect (< in, a comment) still closes its groups, with each of its redirects judged at the current cwd, the session cwd and every cwd a group is still open in, while a closer with no open group of its kind fails closed the same way and the cwd stays where it was, so a later relative write is judged there (a process substitution's ) inside a group, (cd d && diff <(ls) b); echo x > f, is such a closer). A fallback adds one target per redirect per distinct open cwd, so a crafted command with thousands of distinct nested cds and unmatched closers grows quadratically: bounded for a role by the 4096-char cap, and kept for the unroled session by design like the patterns' tail (R-GUARD-ROLE-COMMAND-LENGTH). A bare & ends a command as ; does and runs the list before it in a subshell, so a cd in that list does not move the shell. Only a removal (rm, an rm-source mv or git mv, git rm, an rsync --delete) or a source whose own name a copy or move into a directory places on runs/ or its parent (cp -r x/runs ~/.ppl, cp -R x/.ppl ~) counts the parent of runs/ as landing in it, so a copy by contents (rsync -a src/ ~/, cp -r src/. ~) whose tree carries .ppl/runs is not seen. Targets it cannot resolve - $HOME and other variables, $(...) and backticks, sed -i, a cd it cannot pin down (cd -, pushd +N), a segment cut at a ;, &&, || or | inside quotes (echo \"a;b\" > f leaves an open quote in each half) - are not judged by it: they are denied only for a pipeline-scoped session (a role, or a session whose cwd is inside the active run's repo) and only while a run is active, by R-GUARD-BASH-WRITE-BOUNDARY's unresolvable-target rule, and they are allowed for any other unroled session. Some writes have no write shape this module reads at all and are seen by neither check, for any caller: an interpreter invocation (python3 -c, perl -e), a quoted sh -c / bash -c / env -S string (env -C DIR sh -c 'echo x > f' is allowed, pinned by test_a_shell_string_behind_env_cd_is_opaque_and_allowed), a verb inside a >( or <( process substitution (echo >(cp x f), the substitution guard denies those only for the test worker and the review responder), a shell function, a verb with no write shape here (unlink, rmdir, find -delete, rsync --remove-source-files, tar -x), and the wrappers that are not unwrapped, sudo and xargs (xargs takes its operands from stdin, sudo its own option grammar), in front of a verb that names its target as an argument. Structural reads that match BASE: a cd in a pipe stage is tracked although the shell does not move, a failed cd before || counts as a success, and a cd after then, do, ! or a case pattern's ) is not followed. The control.json carve-out is operator-only and applies to the resolved check only: a literal spelling of the runs directory with any write shape is denied even for control.json, for the operator too"

