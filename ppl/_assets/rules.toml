[[rule]]
id = "R-DONE-DIFF-BOUNDARY"
statement = "Done condition 4: the base-to-head diff must stay inside boundary.write, except for test sources by the run's test patterns (snapshot `[tests]`, Java defaults when absent), and none of it may match boundary.forbid - checked first and winning over both the write-boundary and the test-path exemption, same order as ppl/boundary.py:check_path at write time."
scope = "ppl CLI"
event = "ppl transition done"
enforcement = "blocking"
hook_or_check = "ppl/verdict.py:done_blockers, ppl/gitfacts.py:changed_paths"
deny_test = "tests/test_verdict.py::TestVerdict::test_done_blocked_when_diff_escapes_boundary, tests/test_verdict.py::TestVerdict::test_done_blocked_when_changed_path_matches_forbid"
allow_test = "tests/test_verdict.py::TestVerdict::test_done_allowed_when_everything_holds, tests/test_verdict.py::TestDonePatterns::test_done_exempts_python_tests_under_python_patterns"
owner = "ppl"
residual = "the test-path exemption is tree-wide; only R-ROLE-CODE-WORKER-TESTS keeps a non-test role out of those paths. Round 1 review (W1, cycle 2 wave B): before this fix, done_blockers never consulted boundary.forbid at all, so it was defence in depth against the guard hook rather than an independent proof of the same claim"

[[rule]]
id = "R-DONE-OPEN-FINDING"
statement = "Done condition 5: no unresolved blocking finding is open on the own_diff track of the findings registry, for any SHA - not filtered to the current candidate SHA, because a defect is not an attestation and does not go stale when the head moves. A foreign-track finding never blocks this task's own done gate."
scope = "ppl CLI"
event = "ppl transition done"
enforcement = "blocking"
hook_or_check = "ppl/verdict.py:done_blockers, ppl/findings.py:open_blocking_on_own_diff"
deny_test = "tests/test_verdict.py::TestVerdict::test_done_blocked_on_unresolved_blocking_finding, tests/test_verdict.py::TestVerdict::test_done_still_blocked_after_an_unrelated_commit"
allow_test = "tests/test_verdict.py::TestVerdict::test_done_allowed_when_everything_holds, tests/test_verdict.py::TestVerdict::test_done_allowed_when_the_only_finding_is_foreign, tests/test_verdict.py::TestVerdict::test_done_allowed_once_the_finding_is_marked_fixed"
owner = "ppl"
residual = "severity, status and track are now pinned by ppl/findings.py:add (R-FINDINGS-TRACK-DERIVED), and closure is proved not asserted (R-FINDINGS-FIXED-REQUIRES-PROOF), so this gate's own residual is narrower than before: it still trusts that the finding's evidence text is honest, the same trust every check in this gate places in whoever ran it"

[[rule]]
id = "R-DONE-RETRY-BUDGET"
statement = "Done condition 6: the retry budget must not be exhausted - retry_used >= retry_max, checked with >= because budget.spend refuses any proposed spend past the cap, so retry_used can reach exactly retry_max through a real path but never exceed it."
scope = "ppl CLI"
event = "ppl transition done"
enforcement = "blocking"
hook_or_check = "ppl/verdict.py:done_blockers"
deny_test = "tests/test_verdict.py::TestVerdict::test_done_blocked_when_retry_budget_exhausted"
allow_test = "tests/test_verdict.py::TestVerdict::test_done_allowed_when_everything_holds"
owner = "ppl"
residual = "W6, cycle 2 wave B: the comparison used to be strict `>`, which no real path through budget.spend can ever satisfy (it refuses proposed > cap, so retry_used maxes out AT retry_max) - the condition was unreachable, and its own deny test proved that by writing an impossible state directly into state.json. Fixed to >= and the deny test now drives the state through budget.spend itself, exactly at the cap"

[[rule]]
id = "R-DONE-SECRET-SCAN"
statement = "Done condition 7: a passing receipt exists on the candidate SHA for every check in REQUIRED_CHECKS - secret-scan and focused-tests."
scope = "ppl CLI"
event = "ppl transition done"
enforcement = "blocking"
hook_or_check = "ppl/verdict.py:REQUIRED_CHECKS, ppl/verdict.py:done_blockers"
deny_test = "tests/test_verdict.py::TestVerdict::test_done_blocked_without_secret_scan"
allow_test = "tests/test_verdict.py::TestVerdict::test_done_allowed_when_everything_holds"
owner = "ppl"
residual = "the gate checks that a receipt exists and its rc was zero, not that a scanner ran. The deny test exercises secret-scan; focused-tests rides the same REQUIRED_CHECKS loop with no test of its own"

[[rule]]
id = "R-MR-PRECONDITIONS"
statement = "The stage 6 preconditions - secret scan clean, diff within boundary, no temporary artifacts, verdict PASS - are checked before the push, not only at the terminal transition."
scope = "ppl CLI"
event = "ppl stage enter mr"
enforcement = "n/a"
hook_or_check = "none"
deny_test = ""
allow_test = ""
owner = "orchestrator"
residual = "GAP: ppl stage enter checks the operator halt, the dispatch cap and the stage graph only; none of the four preconditions is checked anywhere before the push, so the first real check of them is ppl transition done, after the MR exists"

# ---------------------------------------------------------------------------
# Corrupt or malformed input on disk (cycle 2 wave B, E1/W5)
# ---------------------------------------------------------------------------

[[rule]]
id = "R-STORE-CORRUPT-JSON"
statement = "Any document read off disk that is not valid JSON is a routable SCHEMA_INVALID error, not an uncaught json.JSONDecodeError - at every call site, because every reader in the codebase goes through the same function."
scope = "ppl CLI, panel, hook"
event = "every store.read_json call - state.json, verdicts/<sha>.json, control.json, threads.json, findings/<id>.json, evidence receipts"
enforcement = "blocking"
hook_or_check = "ppl/store.py:read_json"
deny_test = "tests/test_store.py::TestStore::test_read_corrupt_json_raises_a_routable_error, tests/test_verdict.py::TestVerdict::test_done_blockers_raises_a_routable_error_on_a_corrupt_verdict_file"
allow_test = "tests/test_store.py::TestStore::test_write_then_read_roundtrip"
owner = "ppl"
residual = "callers that used to catch a bare ValueError around store.read_json (ppl/control.py:read) now also catch PplError explicitly, so this fix does not itself change control.json's existing fail-closed behaviour - it only replaces the exception type. A literal JSON `null` or a wrong-shaped-but-valid document (a list where an object belongs) is NOT caught here - see R-EVIDENCE-SHA-PARTITION's non-dict-receipt handling and ppl/findings.py:_load_all for the two different, deliberately different, answers to that case"

[[rule]]
id = "R-FINDINGS-FAILS-CLOSED-ON-MALFORMED"
statement = "A findings-registry document this pipeline cannot make sense of - invalid JSON, or valid JSON of the wrong shape such as a list instead of an object - makes list_all, list_open and open_blocking_on_own_diff refuse with SCHEMA_INVALID, rather than silently treating that finding as absent. A rewritten-to-[] blocking finding must not open the done gate."
scope = "ppl CLI"
event = "ppl transition done, ppl findings list, ppl findings add/status/delete (reading back the registry)"
enforcement = "blocking"
hook_or_check = "ppl/findings.py:_load_all"
deny_test = "tests/test_findings.py::TestOpenBlockingOnOwnDiff::test_a_wrong_shaped_finding_file_fails_closed_rather_than_opening_the_gate, tests/test_findings.py::TestOpenBlockingOnOwnDiff::test_a_malformed_finding_file_fails_closed_not_with_a_raw_crash"
allow_test = "tests/test_findings.py::TestOpenBlockingOnOwnDiff::test_an_own_diff_blocking_finding_is_in_the_set"
owner = "ppl"
residual = "W4, cycle 2 wave B: before this fix, _load_all silently dropped any non-dict document, so rewriting a blocking finding's file to [] opened the done gate (rc=0) and malformed JSON crashed the whole process (rc=1) instead of routing. Same class ppl/_assets/hooks/ppl_guard.py:active_state was hardened against in cycle 1 - the registry did not get the same treatment until this fix"

[[rule]]
id = "R-EVIDENCE-RECEIPT-SHAPE"
statement = "A receipt file that decoded to something other than a JSON object (a literal null, most concretely, from a truncated or corrupt write) is dropped from evidence.for_sha rather than kept as a value the done gate's `.get(\"result\")` cannot call - missing already means \"no passing receipt\" downstream, so this fails the done gate closed instead of crashing it."
scope = "ppl CLI"
event = "ppl transition done, ppl evidence add (reading back a sha's receipts)"
enforcement = "blocking"
hook_or_check = "ppl/evidence.py:for_sha"
deny_test = "tests/test_evidence.py::TestEvidence::test_for_sha_drops_a_receipt_file_whose_content_is_null"
allow_test = "tests/test_evidence.py::TestEvidence::test_receipts_are_partitioned_by_sha"
owner = "ppl"
residual = "same defensive shape as ppl/findings.py:_load_all's isinstance(doc, dict) check, applied here because the gate's polarity is the opposite of findings' - an absent evidence receipt already blocks, so dropping a malformed one is the fail-closed answer, where dropping a malformed FINDING would be fail-open (see R-FINDINGS-FAILS-CLOSED-ON-MALFORMED)"

