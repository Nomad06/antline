residual = "whole-branch review C1 fixed the class this row exists to close (a Bash write walking straight past a hook that denies the identical write through Write/Edit), but it is lexical like every other Bash check in this module: an interpreter invocation - python3 -c \"open(path,'w').write(...)\", or the same in perl/ruby/node - writes the same path with no redirect, tee, cp, or any other shape this looks for, and is not caught. Naming one such shape would buy a longer regex and a false sense of completeness, not a closed class (the same call made for p''pl quote-splitting in R-GUARD-PPL-CLI-DENIED and for the test-worker's execution channel in R-TEST-WORKER-EXECUTION-CHANNEL). An out-of-repo target is deliberately NOT denied for a role (see R-ROLE-OUTSIDE-REPO's residual); an ambiguous target (sed -i, a missing tee/cp/mv/rm/redirect/touch/truncate/ln/install argument, a command substitution, an unresolvable cd) denies only when the command is otherwise pipeline-scoped (a ppl-* role, or a cwd inside the run's repo), so it cannot leak into an unrelated session's ordinary work elsewhere on the machine. A redirect is found outside quotes on the raw segment text, glued to a word (echo x>f) or spaced, a cd's own redirect opening in the pre-cd cwd, while a quoted > (grep \">x\") and a >( process substitution are not targets; a verb spelled by a path (/bin/cp) is read by its basename. A redirect after a subshell's ) or a brace group's } ((cd d && echo x) > f) opens in the cwd the group opened in, and a closer that cannot be matched to an open group of its kind fails closed, its redirects judged at the current cwd, the session cwd and every cwd a group is still open in, as are those of a tail holding another word after its closer (< in, a comment), which still closes the group. A bare & ends a command as ; does and runs its list in a subshell. A copy or move into an existing directory also writes <dest>/<source name>, and a >&- fd close names no file. Round 2 (wave A): touch, truncate, ln and install were missing, found by probing ppl-code-worker specifically after ppl-test-worker denied all four by accident, through the read allowlist R-TEST-WORKER-BASH-READS builds for an unrelated purpose - a role with no read allowlist had nothing else in front of it. ln and install write their LAST positional argument (the linkname / destination), not their first (the symlink target / source) - denying the wrong one would have been a false deny that looked like a pass, so their extraction is the same rule as cp/mv's, not a special case. A single-argument ln (linkname implied by cwd and basename) is unresolvable and denies rather than guesses. A verb with no write shape here (unlink, rmdir, find -delete) removes a repo path unseen, the same lexical limit"

[[rule]]
id = "R-FINDINGS-DEDUPE-PROTOCOL"
statement = "Findings are no longer SHA-filtered (R-DONE-OPEN-FINDING), so a verifier re-reporting an already-open defect on a later candidate would otherwise pile up duplicate blockers. The orchestrator lists open findings before dispatch and hands them to the verifier, which reports only what is genuinely new - this is protocol (the skill's references/stage-5-verification.md, templates/ppl-verifier.md.body), not a code-level refusal."
scope = "orchestrator protocol"
event = "ppl stage enter verification"
enforcement = "soft"
hook_or_check = "ppl/_assets/skill/references/stage-5-verification.md.skeleton, ppl/_assets/templates/ppl-verifier.md.body"
deny_test = ""
allow_test = "tests/test_skill_contract.py::TestSkillContract::test_it_carries_the_findings_dedupe_protocol"
owner = "ppl"
residual = "nothing in code stops a second, near-duplicate finding being added for the same defect - the choice not to refuse duplicates in ppl findings add was deliberate (a code-level refusal cannot tell a repeated report of the same defect from a second, genuinely different one in the same file), so this is enforced by prose the orchestrator is trusted to follow, not by a check"

[[rule]]
id = "R-FINDINGS-FOREIGN-NO-NOTIFICATION"
statement = "A foreign-track finding is born escalated with an owner recorded, but nothing notifies that owner - no email, ticket or message is sent."
scope = "ppl CLI"
event = "ppl findings add"
enforcement = "n/a"
hook_or_check = "none"
deny_test = ""
allow_test = ""
owner = "ppl"
residual = "GAP: v1 has no notification channel at all - recording an owner string is not the same as reaching them. Acceptable for now (the panel and ppl findings list make escalated findings visible to anyone who looks), but a real handoff needs a real notification, not yet built"

[[rule]]
id = "R-BRIEF-SPEC-REVISION-STALE"
statement = "ppl brief set binds spec_revision to a deterministic fingerprint of every brief field verdict.done_blockers actually reads: name_contract, acceptance, and the write/forbid boundary (cycle 2 wave F - previously name_contract alone). ppl verdict record refuses a verdict whose spec_revision does not match the run's currently bound one, and ppl transition done refuses to close over a PASS verdict recorded against a spec_revision the run has since moved past - once a spec_revision has actually been bound by a prior ppl brief set."
scope = "ppl CLI"
event = "ppl brief set, ppl verdict record, ppl transition done"
enforcement = "blocking"
hook_or_check = "ppl/schema.py:spec_revision, ppl/verdict.py:record, ppl/verdict.py:done_blockers"
deny_test = "tests/test_verdict.py::TestSpecRevisionStaleness::test_record_refuses_a_verdict_bound_to_a_stale_spec_revision, tests/test_verdict.py::TestSpecRevisionStaleness::test_done_blockers_flags_a_pass_verdict_recorded_before_a_rebrief, tests/test_cli.py::TestNameContractSpecRevision::test_a_rebrief_that_changes_the_name_contract_stales_an_already_recorded_pass, tests/test_cli.py::TestNameContractSpecRevision::test_a_rebrief_that_shrinks_acceptance_stales_an_already_recorded_pass"
allow_test = "tests/test_verdict.py::TestSpecRevisionStaleness::test_record_accepts_a_verdict_matching_the_bound_spec_revision, tests/test_verdict.py::TestSpecRevisionStaleness::test_record_allows_any_spec_revision_when_none_has_been_bound_yet, tests/test_verdict.py::TestSpecRevisionStaleness::test_done_blockers_allow_when_spec_revision_still_matches, tests/test_cli.py::TestNameContractSpecRevision::test_transition_done_succeeds_when_the_name_contract_never_changed, tests/test_cli.py::TestNameContractSpecRevision::test_a_rebrief_that_changes_nothing_gate_relevant_does_not_stale_a_pass"
owner = "ppl"
residual = "Gated on a spec_revision actually having been bound by a prior ppl brief set: a run that never called brief set has state[spec_revision] == None, so record() is a comparison against the last binding and has nothing to compare an unbriefed run's verdict against, and accepts whatever string it carries. Round 1 review of this task found that this alone left the done gate with no floor - a run that never briefed at all reached done_blockers -> [] with zero acceptance criteria and a fabricated spec_revision, because nothing else in the gate required a brief to exist either. record()'s leniency here is upstream of the actual floor: R-DONE-REQUIRES-BRIEF now refuses an unbriefed run at ppl transition done regardless of what record() was willing to accept, so an unbound spec_revision can be recorded but can never reach done. Cycle 2 wave F found and closed a second gap in the same spirit: the fingerprint hashed name_contract alone, so a re-brief that shrank acceptance without touching name_contract left every outstanding verdict looking current - the done gate proves the criteria that are currently listed, and the list was editable by the same session being gated. Widened to cover acceptance and the write/forbid boundary too; see R-BOUNDARY-SPEC-REVISION-STALE for the ppl boundary set half of the same fix. Deliberately still excludes purpose, success_outcome, governing_requirements, verification and open_decisions - none of them is read by done_blockers, so hashing them would stale a PASS verdict over a change that could not have affected the gate."

[[rule]]
id = "R-NAME-CONTRACT-STRUCTURAL-ONLY"
statement = "validate_brief can only prove name_contract is present and a non-empty mapping - that somebody wrote something. It cannot prove the method signatures, DTO field names or error codes inside are the right ones, and it cannot prove the eventual implementation actually matches them."
scope = "ppl CLI"
event = "ppl brief set"
enforcement = "n/a"
hook_or_check = "none"
deny_test = ""
allow_test = "tests/test_run.py::TestSchema::test_brief_accepts_a_complete_document, tests/test_run.py::TestSchema::test_brief_rejects_an_empty_name_contract"
owner = "ppl"
residual = "PROPERTY: schema.validate_brief proves structural completeness, not correctness - a name_contract full of wrong names hashes and validates exactly as cleanly as a correct one. No static check in this pipeline can prove the test worker's and the code worker's names actually agree without executing both sides against each other, which is out of scope here; the contract reduces the drift a blind test worker risks, it does not close it."

[[rule]]
id = "R-LANE-RESOURCE-ISOLATION"
statement = "A worktree separates files and nothing else. Test databases, ports, temporary directories, queues and object storage are not separated per lane, and no code in this pipeline provides that isolation."
scope = "architecture"
event = "precondition for parallel waves, not a runtime check"
enforcement = "n/a"
hook_or_check = "none"
deny_test = ""
allow_test = ""
owner = "ppl"
residual = "GAP: v1 is one sequential lane (section 2), so nothing here needed per-lane resource isolation yet - the gap is named now because parallel waves (also out of scope for v1) must not be enabled before it closes. This repository's own local dev stack (localenv/docker/base/docker-compose.yml) shares one Postgres, one MinIO, one Kafka, one Consul/Redis/OpenSearch and a fixed set of ports across every worktree on the machine, and its Testcontainers-based integration test modules bind the same host Docker daemon - two lanes running integration tests at once would collide on all of it, not just the schema or the bucket names."

[[rule]]
id = "R-DONE-REQUIRES-BRIEF"
statement = "ppl transition done refuses a run with no spec_revision bound or an empty acceptance list, independently of any other check - a run that never called ppl brief set (ppl boundary set is its own command and needs no brief) must not reach done just because every other blocker happens to iterate zero times or has nothing to compare against."
scope = "ppl CLI"
event = "ppl transition done"
enforcement = "blocking"
hook_or_check = "ppl/verdict.py:done_blockers"
deny_test = "tests/test_verdict.py::TestDoneGateRequiresABrief::test_the_reviewers_probe_no_longer_reaches_zero_blockers, tests/test_verdict.py::TestDoneGateRequiresABrief::test_refuses_specifically_on_an_unbound_spec_revision, tests/test_verdict.py::TestDoneGateRequiresABrief::test_refuses_specifically_on_an_empty_acceptance_list"
allow_test = "tests/test_verdict.py::TestDoneGateRequiresABrief::test_allowed_once_the_run_was_actually_briefed"
owner = "ppl"
residual = "Round 1 review of cycle 2 Task 7 found this: both of the task's own new spec_revision checks were gated on state[spec_revision] is not None, so a run that never briefed at all was never checked by either of them, and the pre-existing empty-acceptance-list vacuity (not introduced by this task) let the same run's verdict, carrying an invented spec_revision, reach done with zero blockers. Fixed by making a bound spec_revision and a non-empty acceptance list blockers in their own right rather than preconditions for other checks."

