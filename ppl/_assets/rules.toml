owner = "guard-hook"
residual = "round 1 review found the first version was a blocklist and ruled it unsound in principle - the design's own sentence is 'any command shape that cannot be classified is denied', and a blocklist can never satisfy that, because an unrecognised command is by construction unclassified and therefore allowed under a blocklist; naming more verbs would not have fixed it either, since python3 -c or perl -e alone subsumes every reader anyone could name. Rebuilt as an allowlist: everything not matching one of the derived shapes denies, including a shape this cannot parse. Still lexical, like every other Bash check in this module (5.4): a speed bump against the easy path, not a proof no path exists. `bash -c '...'` denies via a leftover unbalanced quote making shlex raise on the wrapped segment - fail-closed on unparseable, not by recognising the wrapper, so a bash -c wrapping an otherwise-allowed shape (e.g. cat of a real test source) also denies, a false deny in the accepted direction. git diff/show are not in the allowlist at all, not even restricted to a test pathspec, since the role has no documented need for either. A shell input redirect (`< file`) has no dedicated handling - it happens to deny in every shape checked (either an unclassified leading token like `done <`, or the `<` operator itself being swept up as a bogus path token that then fails the test-scoped check), which is incidental to the classifier rather than a designed protection, and no attempt was made to find a shape where that incidence does not hold. Whole-branch review C2: the read-verb classifier treated any empty path list as 'filtering a pipe', including rg (recursive by default with no path at all) and grep -r/-R (defaults to the cwd, bundled or not - '-rn' counts) - neither reads stdin, piped or not. Fixed by asking whether the verb is a tree-read regardless of a pipe first, and only falling back to 'genuine pipe filter' when a real `|` fed the segment. Task 2 review: a brace token such as tests/{x,../src/a.py} matched a test glob as written and the shell expanded it into a product read, so path tokens the shell would rewrite are now refused. A plain glob is still judged as written, so a symlink that already sits in a test directory and points at product code leads it elsewhere, see R-TEST-WORKER-READ-TOOLS. Fix round 2: sed, awk and less left the verb list, and options moved to a per-verb allowlist, since grep is GNU, BSD or ugrep by machine and an unlisted option can read a file (ugrep --config) or run a program (ugrep --filter, rg --pre). Every word after the verb is checked, not only paths: grep {x,../src/a.py} tests/x.py is grep x ../src/a.py tests/x.py. Braces, groups and globs count only unquoted, read off the guard's own quote mask, but a $ counts even quoted, since double quotes still expand it, so a regex anchor such as 'x$' is a false deny in the accepted direction. A quoted | still cuts the command into segments, so a pattern holding one denies too. Fix round 3: the file-valued options left the allowlist. Judged as paths they still left the parser to place the pattern and spot a tree read, which it got wrong (grep -f tests/p.txt src/a.py took src/a.py for the pattern, rg -f tests/p.txt walked cwd unnoticed), so a pattern comes only from -e or the first positional and every other operand is a path"

[[rule]]
