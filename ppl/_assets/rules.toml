[[rule]]
id = "R-JIRA-GATE"
statement = "A tracker MCP write tool is denied until the run's stage is merge_watch and ppl merge observed has recorded the merged sha (state.mr.merged_sha). The tools are those of every known tracker, whatever tracker the run names: the run's own tracker's, read from its harness snapshot, plus every other tracker's under that adapter's defaults. Jira's are the write operations the snapshot names (the adapter defaults, which cover comment, edit, transition, worklog, create, executeWrite, executeDestructive, Confluence page create/update and page comments, and graph context add, when the snapshot is missing or malformed) under any MCP prefix the same snapshot names (defaults: the Atlassian server's two prefixes with their numbered duplicates), and GitHub Issues' are the GitHub MCP server's nine issue write operations under any mcp__<server>__ prefix."
scope = "active run, scoped by role, target path, cwd, or the isolated broadening"
event = "PreToolUse on a tracker MCP write tool"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:is_tracker_write_tool, ppl/_assets/hooks/ppl_guard.py:tracker_mcp_write, ppl/_assets/hooks/ppl_guard.py:tracker_from_snapshot, ppl/_assets/hooks/ppl_guard.py:tracker_gate_denial, ppl/_assets/hooks/ppl_guard.py:decide"
deny_test = "tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_a_github_issues_run_still_gates_jira_mcp_writes, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_a_snapshot_read_that_raises_skips_no_gate, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_the_installed_matcher_passes_github_mcp_issue_writes_to_the_guard, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_a_jira_run_also_gates_github_mcp_issue_writes, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_a_failing_check_reads_as_a_write, tests/test_guard.py::TestGuard::test_jira_write_is_denied_before_merge_watch, tests/test_guard.py::TestGuard::test_jira_gate_fires_for_unroled_session_outside_repo_when_isolated, tests/test_guard.py::TestGuard::test_jira_write_under_the_rovo_prefix_is_denied_before_merge_watch, tests/test_guard.py::TestGuard::test_jira_write_under_a_numbered_rovo_prefix_is_denied_before_merge_watch, tests/test_guard.py::TestGuard::test_tracker_gate_uses_the_snapshot_prefixes, tests/test_guard.py::TestGuard::test_tracker_gate_falls_back_to_the_defaults_without_a_snapshot, tests/test_guard.py::TestGuard::test_tracker_gate_survives_a_malformed_tracker_table, tests/test_guard.py::TestGuard::test_tracker_gate_keeps_the_defaults_when_a_snapshot_prefix_is_not_mcp_shaped, tests/test_guard.py::TestGuard::test_the_current_atlassian_write_tools_are_denied_before_merge_watch, tests/test_guard.py::TestGuard::test_the_graph_context_write_is_denied_before_merge_watch, tests/test_guard.py::TestGuard::test_the_older_confluence_write_tools_are_denied_before_merge_watch, tests/test_guard.py::TestGuard::test_tracker_write_in_merge_watch_before_the_merge_is_recorded_is_denied, tests/test_guard.py::TestGuard::test_tracker_write_in_merge_watch_without_any_mr_record_is_denied"
allow_test = "tests/test_guard.py::TestGuard::test_tracker_write_is_allowed_after_ppl_merge_observed, tests/test_guard.py::TestGuard::test_jira_write_is_allowed_at_merge_watch, tests/test_guard.py::TestGuard::test_jira_write_under_the_rovo_prefix_is_allowed_at_merge_watch, tests/test_guard.py::TestGuard::test_jira_read_tools_are_not_gated_under_either_prefix, tests/test_guard.py::TestGuard::test_the_current_atlassian_write_tools_are_allowed_at_merge_watch, tests/test_guard.py::TestGuard::test_the_current_atlassian_read_tools_are_not_gated"
owner = "guard-hook"
residual = "not global: with no active run nothing is checked, and with a non-isolated run an unroled session outside the repo is not reached either. A run's harness snapshot is frozen at ppl init, so a run started before the adapter defaults or the harness lists gained a write operation keeps the lists it was created with until a new run is started. A Jira snapshot's prefixes replace the Jira defaults rather than extend them, for the run's own tracker as for the gate, so a Jira run naming only a custom prefix does not gate the Atlassian default prefixes. The GitHub MCP write regex matches the same operation names under any server, so another server's create_issue or update_issue is denied too, the safe direction"

[[rule]]
id = "R-TRACKER-CLI-GATE"
statement = "A Bash command that writes a tracker through its CLI - any CLI adapter's write check (write_denials, today GitHub Issues through gh: an issue write verb, a gh api call that writes an issues route, a GraphQL issue mutation) - is denied until the run's stage is merge_watch and ppl merge observed has recorded the merged sha (state.mr.merged_sha), the same check R-JIRA-GATE runs. Every known tracker is gated on every run: the checks apply whatever tracker the run names and whatever its harness snapshot holds, an unreadable one included."
scope = "active run, scoped by role, target path, cwd, or the isolated broadening"
event = "PreToolUse on Bash"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:tracker_cli_write, ppl/_assets/hooks/ppl_guard.py:tracker_gate_denial, ppl/_assets/hooks/ppl_guard.py:decide"
deny_test = "tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_gh_issue_comment_before_merge_watch_is_denied_for_the_orchestrator, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_gh_issue_comment_in_merge_watch_before_the_merge_is_recorded_is_denied, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_every_write_shape_is_gated_before_the_merge_is_observed, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_a_corrupt_snapshot_gates_every_cli_tracker, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_a_jira_run_also_gates_gh_issue_writes, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_a_failing_check_reads_as_a_write, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_a_brace_or_a_glob_outside_the_jq_word_is_still_gated, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_the_gate_names_what_the_write_check_read, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_a_snapshot_read_that_raises_skips_no_gate, tests/test_guard_tracker_cli.py::TestTrackerCheckBudget::test_a_check_past_its_budget_holds_the_orchestrator_until_the_merge"
allow_test = "tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_gh_issue_comment_is_allowed_once_the_merge_is_recorded, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_issue_reads_are_not_gated, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_the_pipeline_gh_commands_pass_before_the_merge, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_a_bracketed_jq_read_passes_before_the_merge"
owner = "guard-hook"
residual = "not global, like R-JIRA-GATE: with no active run nothing is checked, and with a non-isolated run an unroled session outside the repo is not reached either. An isolated run widens the gate only to sessions with no agent_type, so a subagent that is not a ppl role, running from outside the repo, is not gated either, the same as R-JIRA-GATE. A role never reaches this gate, R-TRACKER-CLI-NO-ROLE denies it first. On a run in the OS sandbox the four shapes a lexical check cannot see (a renamed gh binary, an API host held in a variable, an interpreter or a script file, a gh config the session changed outside Bash) are no longer a way for a role to reach GitHub: its Bash runs in the OS sandbox with github.com denied (R-OS-SANDBOX-NETWORK) and cannot leave it (R-OS-SANDBOX-ROLE-NO-ESCAPE). The orchestrator's unsandboxed gh is a plain argv the guard reads in full (R-OS-SANDBOX-ORCHESTRATOR-SHAPE), so what stays lexical is this gate: the orchestrator's own stage gate, run on that complete argv. A run started with --no-os-sandbox, a run on Windows, which has no OS sandbox, and a harness that is not on GitHub keep the old residual: the check reads the command's words, so the four shapes above are not seen, and the boundary that would close them is a GitHub credential the role sessions never hold. It errs toward denying: a command it cannot read within its 0.5 s budget, a command that only names an issue write (a commit message, an echo) and a gh api call holding a shell expansion, other than a body on a literal pull request route, wait for the merge like a real write. A pathname glob is read as a write too, except inside a word that opens with a literal, unquoted --jq= or -q=, which stays the jq flag whatever the shell makes of it, and every deny names the check's reading"

[[rule]]
id = "R-TRACKER-CLI-NO-ROLE"
statement = "Every role in boundary.ROLE_RULES is denied a Bash command that writes a tracker through its CLI (every CLI adapter's write check, today GitHub Issues through gh), global, no run required, before and after the merge: the orchestrator writes the tracker once the merge is observed. A role's issue reads stay allowed."
scope = "global, no run required"
event = "PreToolUse, tool=Bash, before active_state()"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:decide, ppl/_assets/hooks/ppl_guard.py:tracker_cli_write"
deny_test = "tests/test_guard_tracker_cli.py::TestTrackerCliNoRole::test_the_code_worker_is_denied_an_issue_write_after_the_merge_is_recorded, tests/test_guard_tracker_cli.py::TestTrackerCliNoRole::test_a_role_is_denied_tracker_writes_with_no_active_run, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_a_failing_check_reads_as_a_write, tests/test_guard_tracker_cli.py::TestTrackerCliNoRole::test_a_role_is_denied_a_brace_or_a_glob_outside_the_jq_word, tests/test_guard_tracker_cli.py::TestTrackerCheckBudget::test_a_padded_role_command_is_denied_within_a_second, tests/test_guard_tracker_cli.py::TestTrackerCheckBudget::test_a_check_past_its_budget_denies_a_role"
allow_test = "tests/test_guard_tracker_cli.py::TestTrackerCliNoRole::test_a_role_keeps_its_own_commands, tests/test_guard_tracker_cli.py::TestTrackerCliGate::test_a_bracketed_jq_read_passes_before_the_merge"
owner = "guard-hook"
residual = "On a run in the OS sandbox a role reaches GitHub through none of a renamed gh binary, an API host held in a variable, an interpreter or a script file, or a gh config the session changed outside Bash: its Bash runs in the OS sandbox with github.com denied (R-OS-SANDBOX-NETWORK) and cannot leave it (R-OS-SANDBOX-ROLE-NO-ESCAPE). A run started with --no-os-sandbox, a run on Windows and a harness that is not on GitHub keep the old residual: the check reads the command's words, so those four are not seen, and the boundary that would close them is a GitHub credential the role sessions never hold. It errs toward denying: a role's command that only names an issue write (a commit message, an echo), or that the check cannot read within its 0.5 s budget, is denied as well"

[[rule]]
id = "R-TRACKER-FETCH-PROVENANCE"
statement = "For a CLI tracker (GitHub Issues through gh) ppl brief set is refused ILLEGAL_TRANSITION until ppl tracker fetch has read the issue into the run, so the briefer, which holds no Bash and no tracker tool, reads the fetched files and not a guess. The refusal comes before the retry cap and is not charged to the briefer. A fetch whose gh call fails (401, 403, 5xx, a timeout, a missing gh) raises EXTERNAL_BLOCKED and writes nothing, and a 404 on the parent or sub-issue endpoint is recorded as unavailable. The issue text is rendered verbatim below a line that says it is data, not instructions."
scope = "ppl CLI"
event = "ppl brief set, ppl tracker fetch"
enforcement = "blocking"
hook_or_check = "ppl/cli.py:cmd_brief, ppl/run.py:record_tracker_fetch"
deny_test = "tests/test_cli.py::TestTrackerFetch::test_brief_set_is_refused_for_a_cli_tracker_before_the_issue_is_fetched"
allow_test = "tests/test_cli.py::TestTrackerFetch::test_brief_set_is_accepted_after_the_fetch, tests/test_cli.py::TestTrackerFetch::test_brief_set_for_a_jira_tracker_needs_no_fetch"
owner = "ppl"
residual = "the fetch proves the issue was read, not that the brief used it. A parent 404 cannot be told apart from having no parent. The sub-issue list is the first page gh api returns. The fetched text is evidence a model reads, so an instruction written into an issue is stopped by the briefer's lack of tools and the rendered data line, not by any filter. A comment body can imitate the rendered `### author, date` structure below the data line"

