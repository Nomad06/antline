[[rule]]
id = "R-REFUSAL-RETRY-CAP"
statement = "ppl brief set, brief challenge, verdict record and findings add refuse a call without a known --from SCHEMA_INVALID, naming the role value to pass, and evidence add defaults it to orchestrator. A SCHEMA_INVALID any of the five raises after its arguments parse is logged to log.jsonl as a refusal event (command, code, message, --from role, lease generation, counted). Only a refusal of the role's output itself is counted - raised inside errors.role_output, around the document's parse and its schema and self-consistency checks, not the staleness checks against an old head or spec_revision - and an accepted call for the same command, role and generation ends the count. The second counted refusal in a row for the same command, role and lease generation parks the run with blocker FORMAT_RETRY_EXHAUSTED and both messages in parking.json, and a later call for that key is refused FORMAT_RETRY_EXHAUSTED before its input is read, parking the run first when it is not parked, until the run resumes from parking or the lease generation changes."
scope = "ppl CLI"
event = "ppl brief set/brief challenge/verdict record/findings add/evidence add refused SCHEMA_INVALID"
enforcement = "blocking"
hook_or_check = "ppl/refusals.py:require_retry_left, ppl/refusals.py:record_refusal, ppl/refusals.py:record_acceptance, ppl/errors.py:role_output, ppl/cli.py:count_refusal"
deny_test = "tests/test_cli.py::TestRefusalRetryCap::test_the_second_refusal_parks_the_run_with_both_messages, tests/test_cli.py::TestRefusalRetryCap::test_a_later_call_is_refused_before_its_input_is_validated, tests/test_cli.py::TestRefusalRetryCap::test_a_missing_from_is_refused_naming_the_role_to_pass_and_not_counted, tests/test_cli.py::TestRefusalRetryCap::test_two_content_refusals_in_a_row_park_on_every_role_output_command, tests/test_cli.py::TestRefusalRetryCap::test_a_spent_key_on_a_run_that_is_not_parked_parks_it_before_refusing, tests/test_cli.py::TestRefusalRetryCap::test_a_counted_refusal_past_the_cap_still_parks_the_run"
allow_test = "tests/test_cli.py::TestRefusalRetryCap::test_another_role_or_command_has_its_own_count, tests/test_cli.py::TestRefusalRetryCap::test_a_new_lease_generation_starts_a_fresh_count, tests/test_cli.py::TestRefusalRetryCap::test_a_resume_after_the_park_allows_the_command_again, tests/test_cli.py::TestRefusalRetryCap::test_an_accepted_call_between_two_refusals_resets_the_count, tests/test_cli.py::TestRefusalRetryCap::test_refusals_of_how_the_command_was_called_are_logged_but_not_counted, tests/test_cli.py::TestRefusalRetryCap::test_a_refusal_count_that_cannot_be_written_warns_and_keeps_the_refusal, tests/test_cli.py::TestRefusalRetryCap::test_two_stale_refusals_in_a_row_are_logged_and_do_not_park, tests/test_cli.py::TestRefusalRetryCap::test_a_from_that_names_no_known_role_is_logged_and_not_counted, tests/test_cli.py::TestRefusalRetryCap::test_a_spent_key_on_a_parked_run_keeps_its_parking_record, tests/test_cli.py::TestRefusalRetryCap::test_a_log_that_cannot_be_read_before_validation_warns_and_lets_validation_run"
owner = "ppl"
residual = "the count is read from log.jsonl, so only the CLI keeps it (a direct Python caller of the validators logs nothing), and an append that fails loses one refusal or one reset: the command's outcome stands, with a warning line on stderr and a refusal_bookkeeping_error event when the log takes it. A log that cannot be read before validation is the same warning and the call is validated as if nothing were counted, so an unreadable log lifts the cap for as long as it stays unreadable. What counts is decided by where the error is raised: a check left outside errors.role_output is not counted, a new one inside it is. The finding fields arrive as flags and count as the role's output, the evidence --rc file does not. That the orchestrator does not edit the content between the two attempts is discipline: no code compares them"

