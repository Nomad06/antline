[[rule]]
id = "R-STUDIO-WRITE-SURFACE"
statement = "The studio writes config.toml, routing.toml, models.json with the models the models step verified, the harness directories, the agent and skill files apply renders, the workspace directory and its .claude/settings.local.json hook registration that the wizard's claude step writes, ~/.ppl/studio, a temporary directory for each playground check, removed when the hook has answered, and the empty temporary working directory of the extraction, removed when Claude has answered, and nothing else."
