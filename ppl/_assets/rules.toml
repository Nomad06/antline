[[rule]]
id = "R-TEST-PATTERNS-FROM-SNAPSHOT"
statement = "The guard, the done gate and ppl apply-patch tell test sources from product code by the run's test patterns (snapshot `[tests]`, Java defaults when absent): the tests.sources globs frozen in runs/<task>/harness.json, boundary.TEST_PATTERNS when that file is missing or has no tests key. A path is test-scoped when one of them matches it or it is the very directory a `<prefix>/**` glob covers (`tests` for `tests/**`, never `pkg/tests`). A snapshot that cannot be read or parsed, a link or any other non-regular file at that path, or a tests table that is malformed or names a glob validation refuses, denies OWNER_DECISION every write of ppl-code-worker and ppl-test-worker inside the repo and every ppl-test-worker dispatch, leaves the test worker no repo path to read (BOUNDARY_VIOLATION, the reason naming the snapshot), blocks ppl transition done and refuses ppl apply-patch OWNER_DECISION, all in the one wording boundary.unknown_patterns_reason builds."
scope = "active run"
event = "PreToolUse on Edit/Write/MultiEdit/NotebookEdit, Bash, Read/Grep/Glob and Agent/Task; ppl transition done; ppl apply-patch"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:test_patterns, ppl/boundary.py:run_test_patterns, ppl/verdict.py:done_blockers, ppl/cli.py:cmd_apply_patch"
deny_test = "tests/test_guard_patterns.py::TestPythonRun::test_a_corrupt_snapshot_denies_both_workers_writes, tests/test_guard_patterns.py::TestPythonRun::test_a_malformed_tests_table_denies_the_test_workers_write_and_read, tests/test_guard_patterns.py::TestPythonRun::test_a_corrupt_snapshot_denies_the_test_worker_dispatch, tests/test_guard_patterns.py::TestPythonRun::test_a_tests_glob_validation_refuses_denies_the_test_workers_bash_write_and_dispatch, tests/test_verdict.py::TestDonePatterns::test_done_is_blocked_when_the_snapshot_is_unreadable, tests/test_cli.py::TestApplyPatchPatterns::test_apply_patch_is_refused_when_the_snapshot_is_unreadable, tests/test_boundary.py::TestEveryPatternSet::test_unknown_patterns_refuse_every_writer_instead_of_reading_as_no_tests"
allow_test = "tests/test_guard_patterns.py::TestPythonRun::test_a_snapshot_from_before_phase_two_reads_as_the_java_defaults, tests/test_guard_patterns.py::TestPythonRun::test_the_test_worker_may_write_a_python_test, tests/test_boundary.py::TestRunTestPatterns::test_a_run_without_a_snapshot_reads_as_the_java_defaults, tests/test_boundary.py::TestEveryPatternSet::test_a_directory_glob_scopes_its_own_directory_only, tests/test_verdict.py::TestDonePatterns::test_done_exempts_python_tests_under_python_patterns"
owner = "guard-hook"
residual = "a missing harness.json reads as the Java defaults, not as untrustworthy: ppl init always writes one and R-RUNS-WRITE-PROTECTION stops a session deleting it, so only a fixture or a run older than the snapshot has none. A corrupt or malformed one stops both workers until the owner restores it from harness.snapshot or re-inits the run, no ppl command rewrites a snapshot. The split is by path, so tests inside product files (Rust #[cfg(test)], doctests) are not split"

[[rule]]
id = "R-TEST-WORKER-NO-DIFF"
statement = "A paraphrase or summary of the implementation in the test worker's dispatch prompt is not detected; R-TEST-WORKER-DISPATCH-LEAK denies patch syntax and verbatim added lines, nothing denies the same content in other words."
scope = "orchestrator, dispatch of ppl-test-worker"
event = "dispatch of the test worker"
enforcement = "n/a"
hook_or_check = "none"
deny_test = ""
allow_test = ""
owner = "orchestrator"
residual = "PROPERTY: the dispatch prompt is free text the orchestrator writes, and no lexical check can tell a description of the behaviour from a description of the code that implements it. What stays open is the orchestrator's discipline, stated in SKILL.md and in templates/ppl-test-worker.md.body: pass acceptance criteria, behaviour, corner cases and the brief's interfaces, never an account of how the implementation works"

[[rule]]
id = "R-TEST-WORKER-DISPATCH-LEAK"
statement = "A dispatch of ppl-test-worker through the Agent tool (or its older name Task) is denied when its prompt carries a line in patch syntax, or two or more significant lines the implementation added since base_sha - committed, staged, unstaged or untracked, test sources by the run's test patterns (snapshot `[tests]`, Java defaults when absent) excluded - that the run's brief does not itself carry. A dispatch that cannot be checked (no base_sha, a git error or timeout, unreadable state) is denied too."
scope = "active run, dispatch of ppl-test-worker"
event = "PreToolUse on Agent/Task"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:dispatch_leak_deny, ppl/_assets/hooks/ppl_guard.py:dispatches_test_worker, ppl/gitfacts.py:added_lines"
deny_test = "tests/test_dispatch_leak.py::TestDispatchLeak::test_a_dispatch_carrying_a_unified_diff_is_denied, tests/test_dispatch_leak.py::TestDispatchLeak::test_a_dispatch_carrying_two_added_lines_is_denied, tests/test_dispatch_leak.py::TestDispatchLeak::test_added_lines_quoted_as_markdown_still_count, tests/test_dispatch_leak.py::TestDispatchLeak::test_the_older_task_tool_name_is_checked_too, tests/test_dispatch_leak.py::TestDispatchLeak::test_an_uncommitted_new_file_counts_as_added, tests/test_dispatch_leak.py::TestDispatchLeak::test_a_non_isolated_run_dispatching_from_elsewhere_is_checked, tests/test_dispatch_leak.py::TestDispatchLeak::test_a_dispatch_without_a_recorded_base_is_denied, tests/test_dispatch_leak.py::TestDispatchLeak::test_a_dispatch_against_unreadable_state_is_denied, tests/test_dispatch_leak.py::TestDispatchLeak::test_an_unexpected_error_in_the_check_denies, tests/test_dispatch_leak.py::TestDispatchLeak::test_a_main_file_with_a_non_ascii_name_still_counts, tests/test_dispatch_leak.py::TestDispatchLeak::test_a_main_file_with_a_quote_in_its_name_still_counts, tests/test_dispatch_leak.py::TestDispatchLeak::test_a_main_file_with_a_space_in_its_name_is_named_plainly, tests/test_dispatch_leak.py::TestDispatchLeak::test_an_added_line_that_looks_like_a_header_does_not_hide_the_rest, tests/test_dispatch_leak.py::TestDispatchLeak::test_an_untracked_symlink_to_an_endless_device_is_not_read, tests/test_dispatch_leak.py::TestDispatchLeak::test_a_renamed_unchanged_file_counts_as_added, tests/test_dispatch_leak.py::TestDispatchLeak::test_a_product_file_named_like_a_test_directory_still_counts"
allow_test = "tests/test_dispatch_leak.py::TestDispatchLeak::test_acceptance_criteria_only_are_allowed, tests/test_dispatch_leak.py::TestDispatchLeak::test_interface_lines_the_brief_agreed_are_allowed, tests/test_dispatch_leak.py::TestDispatchLeak::test_one_added_line_alone_is_allowed, tests/test_dispatch_leak.py::TestDispatchLeak::test_added_lines_in_test_sources_do_not_count, tests/test_dispatch_leak.py::TestDispatchLeak::test_the_same_prompt_to_the_code_worker_is_allowed, tests/test_dispatch_leak.py::TestDispatchLeak::test_without_an_active_run_a_dispatch_is_left_alone, tests/test_dispatch_leak.py::TestDispatchLeak::test_python_test_lines_are_not_counted_under_python_patterns"
owner = "guard-hook"
residual = "lexical, like every other check in this module: a line counts only when it reappears whole after whitespace and markdown are stripped, so a re-wrapped or partly quoted line passes, and so do added lines shorter than 24 characters or with fewer than 12 alphanumerics, and a single shared line. SendMessage to an already running test worker names a recipient, not a role, and is not checked. A renamed file counts as added in full (the diff runs with --no-renames). Untracked files are read only when they are regular files, never through a symlink, and only their first 1 MiB. Verified against Claude Code 2.1.302: PreToolUse on the Agent tool carries tool_input.prompt and subagent_type, and a deny stops the subagent before SubagentStart"

[[rule]]
id = "R-TEST-WORKER-EXECUTION-CHANNEL"
statement = "Running the build and tests the test worker itself invokes necessarily surfaces the implementation - a compiler error names the offending method, a stack trace names classes, a failing assertion prints the actual value - and nothing here closes that while the worker still has to run its own tests."
scope = "ppl-test-worker"
event = "the worker running its own build/test commands"
enforcement = "n/a"
hook_or_check = "none"
deny_test = ""
allow_test = ""
owner = "orchestrator"
residual = "PROPERTY: deliberate and casual reads are closed by R-TEST-WORKER-READ-TOOLS and R-TEST-WORKER-BASH-READS, but the execution-shaped channel is inherent, not an oversight - a worker cannot verify RED-before-fix without running something, and running it prints implementation detail no hook can filter out of a tool result. The channel this leaves open in plain words: a worker could in principle fit an assertion's expected value to whatever the run just printed rather than to the specified behaviour, and nothing here or elsewhere in this codebase tells that apart from a legitimately-derived assertion. Note also that target/surefire-reports/*.txt lands under the repo tree and is not a test path by is_test_path, so R-TEST-WORKER-BASH-READS denies a direct `cat` of it even though its content already reached the worker live in the same Bash call's own output - a denial that closes nothing this residual does not already admit is open"

[[rule]]
id = "R-CODE-WORKER-READS-UNRESTRICTED"
statement = "ppl-code-worker is not denied reads of test sources; only its writes are boundary-checked."
scope = "ppl-code-worker"
event = "PreToolUse on Read/Grep/Glob/Bash"
enforcement = "n/a"
hook_or_check = "none"
deny_test = ""
allow_test = "tests/test_guard.py::TestGuard::test_code_worker_reading_a_test_source_is_not_restricted, tests/test_guard.py::TestGuard::test_code_worker_cat_of_a_main_source_is_not_restricted_by_this_check"
owner = "design"
residual = "PROPERTY: a deliberate mirror decision, not an oversight. Doctrine's rule that the implementation worker 'does not touch tests' is about writes - one agent writing both the code and the test that checks it is the profanation the split exists to prevent. A worker reading the tests it must satisfy while it implements is ordinary TDD, not that failure mode: the property this design protects is the test's independence from the implementation, not the reverse, and restricting the code worker's reads would buy nothing it does not already have another way, since it runs the tests directly and sees their output regardless"

