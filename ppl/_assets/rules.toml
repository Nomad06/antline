[[rule]]
id = "R-GUARD-PPL-CLI-DENIED"
statement = "The guard hook denies every role in boundary.ROLE_RULES from invoking a state-changing ppl CLI subcommand through Bash - directly as ppl, or as python3 -m ppl[.cli] / a bare ppl.cli token - global, no run required; only a fixed set of read-only subcommands (ppl show, ppl status, ppl doctor, ppl metrics, ppl findings list, ppl control get, ppl routing show, ppl approval check, ppl mr state, ppl review pending) stay allowed."
scope = "guard hook"
event = "PreToolUse, tool=Bash"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:_ppl_cli_is_state_changing, ppl/_assets/hooks/ppl_guard.py:decide"
deny_test = "tests/test_guard.py::TestGuard::test_code_worker_marking_its_own_finding_fixed_is_denied, tests/test_guard.py::TestGuard::test_test_worker_deleting_a_finding_is_denied, tests/test_guard.py::TestGuard::test_code_worker_recording_its_own_passing_evidence_is_denied, tests/test_guard.py::TestGuard::test_code_worker_opening_its_own_done_gate_is_denied, tests/test_guard.py::TestGuard::test_a_role_recording_the_merge_to_open_the_tracker_gate_is_denied, tests/test_guard.py::TestGuard::test_a_readonly_call_does_not_hide_a_second_unsafe_one_after_and, tests/test_guard.py::TestGuard::test_a_readonly_call_does_not_hide_a_second_unsafe_one_after_semicolon, tests/test_guard.py::TestGuard::test_a_readonly_findings_list_does_not_hide_a_findings_delete, tests/test_guard.py::TestGuard::test_an_unparseable_ppl_invocation_is_denied_not_allowed, tests/test_guard.py::TestGuard::test_python_dash_m_ppl_cli_invocation_is_denied, tests/test_guard.py::TestGuard::test_python_dash_m_ppl_invocation_without_dot_cli_is_denied, tests/test_guard.py::TestGuard::test_a_readonly_ppl_call_does_not_hide_a_python_dash_m_one, tests/test_guard.py::TestGuard::test_a_ppl_invoked_by_path_is_still_denied, tests/test_guard.py::TestGuard::test_the_deny_message_names_ppl_show_in_the_form_the_cage_allows, tests/test_guard_tracker_cli.py::TestTrackerCliNoRole::test_a_role_may_not_run_ppl_tracker_fetch"
allow_test = "tests/test_guard.py::TestGuard::test_code_worker_listing_findings_is_still_allowed, tests/test_guard.py::TestGuard::test_code_worker_running_ppl_show_is_still_allowed, tests/test_guard.py::TestGuard::test_the_data_root_named_dot_ppl_is_not_a_ppl_invocation, tests/test_guard.py::TestGuard::test_orchestrator_with_no_role_may_still_run_ppl_transition_done, tests/test_guard.py::TestGuard::test_python_dash_m_ppl_read_only_lookup_is_still_allowed, tests/test_guard.py::TestGuard::test_git_stash_tag_containing_ppl_is_still_not_a_false_positive"
owner = "ppl"
residual = "round 2 review fixed the two fail-open holes (first-match-only via .search(), and an unparseable shape defaulting to allow) - every occurrence is now scanned (finditer, anchored per-occurrence with .match(command, pos)) and an unparseable one denies. round 3 review: probed six more shapes; a variable holding the literal word (P=ppl; $P ...), bash -c '...', and a pipe to sh all already denied, because the literal word ppl survives in each - the previous residual's claim that this check is bypassed through an alias or a variable was wrong and has been removed rather than softened. python3 -m ppl / python3 -m ppl.cli / a bare ppl.cli token are now matched the same as the word ppl. What remains open, on purpose: quote-splitting (p''pl, and by the same reasoning base64 or any other shell-quoting or encoding trick) is not caught - a lexical matcher cannot win that arms race, and this check is a speed bump against an agent taking the easy path, not a proof no path exists (see DESIGN 5.4's closing paragraph). A word ppl right after a dot is not read as an invocation, since ~/.ppl is the default data root, so a launcher renamed to .ppl is not seen, like a launcher under any other name. A positional ppl show <id> is denied: show takes --task <id>, and the deny message names that form. Confirmed by direct probe throughout, not merely reasoned"

