[[rule]]
id = "R-BUDGET-USD-CAP"
statement = "With usd_max above zero, ppl stage enter and ppl transition refuse with BUDGET_EXHAUSTED once usd_used plus the usage the run recorded, priced with the prices in force at ppl init, reaches usd_max, and a usd_used that is not a finite number >= 0 counts as spent. ppl park stays available. ppl init copies usd_max from config.toml [budgets], refusing an unknown key there, and the [prices] table into the run, and zero means no cap."
scope = "ppl CLI"
