mote_url_to_another_repo_denies, tests/test_guard_os_sandbox.py::GitShapes::test_a_remote_the_config_does_not_name_is_denied, tests/test_guard_os_sandbox.py::GitShapes::test_git_without_a_forge_repo_is_denied, tests/test_guard_os_sandbox.py::GitShapes::test_a_push_with_no_active_run_is_denied, tests/test_guard_os_sandbox.py::GitShapes::test_a_fetch_without_no_recurse_submodules_is_denied, tests/test_guard_os_sandbox.py::GitShapes::test_a_hung_git_denies, tests/test_guard_os_sandbox.py::GitShapes::test_a_slow_pinned_git_is_cut_off_and_denied, tests/test_guard_os_sandbox.py::GitShapes::test_a_git_error_never_reaches_the_hook_stderr"
allow_test = "tests/test_guard_os_sandbox.py::GitShapes::test_push_of_the_run_branch_is_allowed, tests/test_guard_os_sandbox.py::GitShapes::test_branch_delete_of_the_run_branch_is_allowed, tests/test_guard_os_sandbox.py::GitShapes::test_fetch_of_the_default_branch_from_the_checkout_is_allowed, tests/test_guard_os_sandbox.py::GitShapes::test_core_hookspath_in_local_config_is_tolerated, tests/test_guard_os_sandbox.py::GitShapes::test_the_fetch_allow_entry_is_the_shape_the_guard_allows, tests/test_guard_os_sandbox.py::GitShapes::test_the_accepted_push_lands_only_the_run_branch_whatever_the_global_config, tests/test_guard_os_sandbox.py::GitShapes::test_the_shapes_carry_the_pinned_config_word_for_word"
owner = "guard-hook"
residual = "the repository is read right before the call, so a config key, an include or a HEAD a role changes in between is not caught: a process a role leaves running past its sandboxed command can rewrite the local config between the guard's check and the unsandboxed fetch or push. The fixed -c words, in the order escape_git.PINNED_CONFIG holds them and as the only -c words, win over what it writes for every key known to run a program at fetch or push time: a hook, the ssh command, a credential helper, an askpass program, a gpg program for a signed push, core.alternateRefsCommand, core.fsmonitor and an automatic gc or maintenance run, and they leave ssh the one transport, ext, file and git:// (where core.gitProxy runs a program) refused by name. What stays open: a key git may grow later or one not known here, a url.<base>.insteadOf or remote pushurl redirect that sends the pushed content to another ssh host with the operator's key, a per-protocol allow a role sets for http or https, which reopens that transport with no credential, and a remote helper that is already on PATH. Fetching and pushing through a gitdir ppl owns outside the write scope removes the class and is the recorded follow-up, and whether a process outlives its sandboxed command is the live rehearsal's U7. An https remote is refused outright under the profile, fetch included: the checkout needs an ssh remote. The run's repo is the one its state.json records, which a role can write, so at worst a role-made branch of another repository goes to the forge repo, never the default branch. What the command line pins holds whatever any config says: the destination ref, since a push names refs/heads/<branch>:refs/heads/<branch> and a delete refs/heads/<branch> in full, and tags and submodules, switched off by --no-follow-tags and --no-recurse-submodules on the push and --no-recurse-submodules on the fetch, word for word ppl's allow entry. Beyond that only the local and worktree config are read: the operator's global and system config, which the guard cannot read, are trusted for anything the command line does not override, a url rewrite there included. The branch pushed is whatever a role named the branch HEAD is on, within the plain-name rule, never the default branch. A local git lfs install writes filter.lfs keys, which deny. The branch is compared to the default branch case-insensitively, a false deny for a case-only variant that <TASK-ID>-<slug> never produces. --show-scope needs git 2.26 or later"

[[rule]]
id = "R-OS-SANDBOX-PROTECTED-PATHS"
statement = "A pipeline session's edit tool may write only inside the OS sandbox's write scope and Claude Code's own projects and plans directories while the guard facts exist, and never what the profile denies sandboxed Bash to write, a .git directory or file there, the pinned binaries, the workspace's .claude directory or .mcp.json, ppl's own code, config, harnesses and guard facts, Claude Code's settings, or the git, ssh and gh config."
scope = "global, every role"
event = "PreToolUse on Edit/Write/MultiEdit/NotebookEdit, every path key of the call, before any run file is read, while PPL_HOME/os_sandbox.json exists: every session, roles, other subagents and the orchestrator alike, whatever the cwd, and facts that cannot be read deny every edit"
enforcement = "blocking"
hook_or_check = "ppl/escape_paths.py:target_denial, ppl/escape_paths.py:allowed_roots, ppl/escape_paths.py:deny_write, ppl/os_sandbox.py:deny_write, ppl/escape_paths.py:protected_paths, ppl/escape.py:edit_denial, ppl/_assets/hooks/ppl_guard.py:protected_edit_denial, ppl/_assets/hooks/ppl_guard.py:_decide"
deny_test = "tests/test_guard_os_sandbox.py::TestProtectedPaths::test_a_role_cannot_edit_the_gitconfig, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_the_orchestrator_cannot_edit_the_gh_config, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_a_symlink_into_ssh_is_denied, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_tilde_and_dotdot_are_resolved, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_the_workspace_claude_dir_the_pins_and_ppl_files_are_protected, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_a_pin_reached_through_its_link_is_denied, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_a_case_variant_of_a_protected_path_is_denied, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_config_the_environment_moves_is_protected, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_claude_settings_mcp_config_and_ppl_code_are_protected, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_a_firmlink_name_of_a_protected_path_is_denied, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_a_hard_link_of_a_protected_file_is_denied, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_every_path_key_of_the_call_is_checked, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_a_path_the_guard_cannot_place_is_denied, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_an_edit_outside_the_write_scope_is_denied, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_the_pinned_gits_system_config_and_helpers_are_denied, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_a_path_with_edge_whitespace_or_a_control_character_is_denied, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_a_git_directory_or_file_in_the_write_scope_is_denied, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_the_sandboxs_write_denials_hold_inside_the_write_scope, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_unreadable_facts_deny_every_edit, tests/test_guard_os_sandbox.py::TestHugeRunFile::test_the_role_mcp_webfetch_and_edit_checks_read_no_run_file"
allow_test = "tests/test_guard_os_sandbox.py::TestProtectedPaths::test_an_edit_outside_the_pipeline_scope_is_left_alone, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_an_edit_inside_the_write_scope_is_allowed, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_a_source_file_next_to_a_git_directory_is_allowed, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_without_guard_facts_the_edit_check_stands_aside, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_the_allowed_roots_are_the_write_scope_and_claude_projects_and_plans, tests/test_guard_os_sandbox.py::TestProtectedPaths::test_protected_paths_lists_the_config_the_pins_and_ppl_files"
owner = "guard-hook"
residual = "an MCP server registered for the workspace session runs outside the OS sandbox and can write anywhere, unchecked by this rule, so the pipeline workspace should register none. The profile's denyWrite (the workspace and each pin's directory) is the one ppl harness apply records in the facts as deny_write, or for facts written before it did, the same set computed from the workspace and the pins. Inside the write scope a role's sandboxed Bash can write as well, R-RUNS-WRITE-PROTECTION still governs PPL_HOME/runs, and a file with more than one link is refused there. A path is refused when it starts or ends with JavaScript whitespace or holds a control character, and is then resolved right before the call against the payload cwd, with ~ read both expanded and as written, so a link made between the check and the write is not caught and a ~ spelling from a cwd outside the allowed roots is refused. With no PPL_HOME/os_sandbox.json, as on a GitLab or Jira harness that has not opted in to the OS sandbox, this check stands aside for every session and an edit tool meets only the older rules, R-ROLE-OUTSIDE-REPO and R-RUNS-WRITE-PROTECTION. While the facts exist every session the guard sees is in scope, so under a global registration the orchestrator edits only inside the write scope in any session"

[[rule]]
id = "R-FORGE-GH-MCP-NO-ROLE"
statement = "A role's call to any tool of a GitHub MCP server is denied."
scope = "global, every role"
event = "PreToolUse on an mcp__ tool, under the default names before any run file is read and under the snapshot's server name after, and harness validate and routing render for a role's granted tools"
enforcement = "blocking"
hook_or_check = "ppl/escape.py:github_mcp_tool, ppl/escape.py:forge_github_prefixes, ppl/_assets/hooks/ppl_guard.py:github_mcp_prefixes, ppl/_assets/hooks/ppl_guard.py:_decide, ppl/harness.py:_check_granted_tools, ppl/routing.py:role_tools"
deny_test = "tests/test_guard_os_sandbox.py::TestGithubMcp::test_a_role_cannot_call_a_github_mcp_pull_request_tool, tests/test_guard_os_sandbox.py::TestGithubMcp::test_a_numbered_github_server_is_matched, tests/test_guard_os_sandbox.py::TestGithubMcp::test_the_snapshot_server_name_is_matched, tests/test_harness.py::TestMalformedInputIsRefusedNotATraceback::test_a_role_cannot_be_granted_a_github_mcp_tool, tests/test_routing.py::TestNoRoleHoldsAJiraWriteTool::test_a_doc_that_would_grant_a_github_mcp_tool_is_refused_at_render"
allow_test = "tests/test_guard_os_sandbox.py::TestGithubMcp::test_the_orchestrator_may_read_through_github_mcp, tests/test_guard_os_sandbox.py::TestGithubMcp::test_a_role_keeps_the_other_mcp_servers"
owner = "guard-hook"
residual = "a GitHub MCP server is known by its name: mcp__github__ and its numbered duplicates in any case, any server whose name holds github, and the forge.mcp_server a github forge names in the run's snapshot, which sits in runs/ where sandboxed Bash can write. A server reaching GitHub under another name is not seen. A tracker MCP write keeps the R-JIRA-NO-ROLE-TOOL reason. Like every MCP denial it fires only for a tool the registered matcher passes to the hook, and GitHub MCP names are not guarded names (R-GUARD-MATCHER). A subagent that is not a ppl-* role is not checked. A harness granting a role a GitHub MCP tool in knowledge.extra_tools or among the tracker's read tools is refused HARNESS_INVALID at validate, and the forge's role tools meet the same check at render"

[[rule]]
id = "R-WEBFETCH-GITHUB-NO-ROLE"
statement = "A role's WebFetch of a github.com URL is denied."
scope = "global, every role"
event = "PreToolUse on WebFetch, before any run file is read"
enforcement = "blocking"
hook_or_check = "ppl/escape.py:webfetch_github, ppl/_assets/hooks/ppl_guard.py:_decide, ppl/_assets/hooks/ppl_guard.py:GUARDED_TOOL_NAMES"
deny_test = "tests/test_guard_os_sandbox.py::TestWebFetchGithub::test_a_role_cannot_webfetch_github, tests/test_guard_os_sandbox.py::TestWebFetchGithub::test_a_disguised_github_url_is_denied"
allow_test = "tests/test_guard_os_sandbox.py::TestWebFetchGithub::test_a_role_may_webfetch_another_host, tests/test_guard_os_sandbox.py::TestWebFetchGithub::test_the_orchestrator_may_webfetch_github, tests/test_guard_os_sandbox.py::TestWebFetchGithub::test_webfetch_is_a_guarded_tool_name"
owner = "guard-hook"
residual = "the host is read the ways a URL parser may read it (userinfo, port, case, trailing dots, percent escapes, fullwidth letters and dots, Punycode, a backslash, missing slashes or no scheme at all), and a URL urlsplit cannot read is denied, but only github.com and its subdomains count: a GitHub IP address, githubusercontent.com and github.io are not caught. A redirect to another host comes back to the model as a new URL, which meets the check again. It fires only under a matcher that passes WebFetch (R-GUARD-MATCHER), and a subagent that is not a ppl-* role is not checked"
