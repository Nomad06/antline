# State machine
# ---------------------------------------------------------------------------

[[rule]]
id = "R-FSM-STAGE-GRAPH"
statement = "A stage transition that the graph does not allow is refused with ILLEGAL_TRANSITION, and ppl stage enter refuses a stage name outside fsm.STAGES at the parser with SCHEMA_INVALID."
scope = "ppl CLI"
event = "ppl stage enter"
enforcement = "blocking"
hook_or_check = "ppl/fsm.py:check_stage, ppl/run.py:stage_enter, ppl/cli.py:build_parser"
deny_test = "tests/test_fsm.py::TestStageGraph::test_cannot_skip_verification, tests/test_run.py::TestRun::test_stage_enter_rejects_an_illegal_jump, tests/test_cli.py::TestCli::test_stage_enter_takes_only_a_stage_of_the_state_machine, tests/test_skill_contract.py::TestSequences::test_the_walk_refuses_merge_watch_straight_from_review, tests/test_skill_contract.py::TestSeededDrift::test_an_illegal_recovery_instruction_in_a_reference_is_reported"
allow_test = "tests/test_fsm.py::TestStageGraph::test_happy_path_is_legal"
owner = "ppl"
residual = ""

[[rule]]
id = "R-MERGE-WATCH-TERMINAL"
statement = "The merge_watch tail cannot reopen or alter the lifecycle: it has no outgoing stage edge and done is a terminal lifecycle state."
scope = "ppl CLI"
event = "ppl stage enter, ppl transition"
enforcement = "blocking"
hook_or_check = "ppl/fsm.py:_FORWARD, ppl/fsm.py:check_lifecycle"
deny_test = "tests/test_fsm.py::TestLifecycle::test_done_is_terminal, tests/test_fsm.py::TestStageGraph::test_merge_watch_only_follows_closure"
allow_test = ""
owner = "ppl"
residual = ""

[[rule]]
id = "R-PARK-RESUME-RESTORES-LIFECYCLE"
statement = "Resuming from the parking stage (ppl stage enter <resume_stage>) restores lifecycle status from blocked to in_progress, so a parked run can still reach done - a run parked before it ever reached in_progress (still planned) is left untouched."
scope = "ppl CLI"
event = "ppl stage enter, immediately after ppl park"
enforcement = "blocking"
hook_or_check = "ppl/run.py:stage_enter"
deny_test = "tests/test_fsm.py::TestLifecycle::test_blocked_cannot_reach_done_directly"
allow_test = "tests/test_run.py::TestResumeFromParking::test_resuming_from_parking_restores_in_progress, tests/test_run.py::TestResumeFromParking::test_resuming_from_parking_before_baseline_does_not_fabricate_in_progress"
owner = "ppl"
residual = "W3, cycle 2 wave B: before this fix, a parked run's lifecycle status stayed `blocked` forever - _LIFECYCLE_EDGES['blocked'] is only {in_progress, failed}, so `ppl transition done` from a resumed-but-never-restored run was ILLEGAL_TRANSITION, and the string `in_progress` appears nowhere in skill/, so the documented flow had no way out either. Fixed in code rather than in the skill: a recovery path that depends on the operator remembering an undocumented `ppl transition in_progress` call is not a recovery path"

[[rule]]
id = "R-PARK-RESUME-EXACT"
statement = "A run resuming from parking or escalation may enter only the resume stage it was actually in when it parked or escalated - not any other real stage - and a missing or untrustworthy resume record refuses every target rather than allowing one."
scope = "ppl CLI"
event = "ppl stage enter, immediately after a run leaves parking or escalation"
enforcement = "blocking"
hook_or_check = "ppl/run.py:_resume_target, ppl/run.py:_parking_resume_stage, ppl/run.py:stage_enter"
deny_test = "tests/test_run.py::TestParkingCannotTeleport::test_briefing_to_gates_is_illegal_whether_or_not_the_run_is_parked, tests/test_run.py::TestParkingCannotTeleport::test_resuming_from_parking_only_the_recorded_stage_is_legal, tests/test_run.py::TestParkingCannotTeleport::test_missing_parking_record_fails_closed_rather_than_wide_open, tests/test_run.py::TestParkingCannotTeleport::test_direct_stage_enter_into_parking_is_refused, tests/test_run.py::TestEscalationCannotTeleport::test_resuming_from_escalation_only_the_recorded_stage_is_legal"
allow_test = "tests/test_run.py::TestParkingCannotTeleport::test_a_second_park_still_resumes_to_the_first_recorded_stage, tests/test_run.py::TestEscalationCannotTeleport::test_escalation_from_admission_resumes_through_admissions_own_edges"
owner = "ppl"
residual = "D1, cycle 2 wave D: `fsm._FORWARD['parking']` and `fsm._FORWARD['escalation']` are both `set(STAGES) - {merge_watch}`, by design, for ENTERING those stages from anywhere - fsm.py stays a pure, unaware-of-any-particular-run stage graph, so it still accepts any real stage as a target FROM parking or escalation too, at the fsm layer. This rule is the layer above it, in ppl/run.py, that narrows that back down for a real run using the recorded resume point - the same layering `control.enforce` already uses on top of fsm.check_stage for the pause gate. Escalation gets the identical treatment as parking rather than an exemption: it is reachable directly with `ppl stage enter escalation` (never only through `ppl escalate`, which parks instead - see ppl/watchdog.py's comment on this), carried the identical wide edge, and the ledger had already flagged (c2-task-4 review) that cmd_escalate never produces it - a separate, deliberately deferred question about whether the stage should exist at all, not a reason to leave its resume edge open in the meantime."

[[rule]]
id = "R-BRIEF-SCHEMA"
statement = "A brief with a missing field or a field of the wrong type, no acceptance id, a non-string or blank acceptance entry, an empty write boundary, overlapping write and forbid lists, or an empty name_contract is refused."
scope = "ppl CLI"
event = "ppl brief set"
enforcement = "blocking"
hook_or_check = "ppl/schema.py:validate_brief, ppl/cli.py:cmd_brief"
deny_test = "tests/test_run.py::TestSchema::test_brief_rejects_empty_write_boundary, tests/test_run.py::TestSchema::test_brief_rejects_overlap_between_write_and_forbid, tests/test_run.py::TestSchema::test_brief_rejects_a_dict_shaped_acceptance_entry, tests/test_run.py::TestSchema::test_brief_rejects_a_list_shaped_acceptance_entry, tests/test_run.py::TestSchema::test_brief_rejects_an_empty_string_acceptance_entry, tests/test_run.py::TestSchema::test_brief_rejects_missing_name_contract, tests/test_run.py::TestSchema::test_brief_rejects_an_empty_name_contract, tests/test_run.py::TestSchema::test_brief_rejects_a_field_of_the_wrong_type"
allow_test = "tests/test_run.py::TestSchema::test_brief_accepts_a_complete_document"
owner = "ppl"
residual = "E1 CRITICAL, cycle 2 wave B: only presence (a non-empty list) was ever checked, never the elements' shape - a dict-shaped acceptance entry was accepted here and crashed done_blockers with a raw TypeError five stages later, exit 1 rather than a routable exit 2, at the single most load-bearing step in the system"

[[rule]]
id = "R-BOUNDARY-SET-DISJOINT"
statement = "ppl boundary set enforces the same disjoint-write/forbid rule as the brief path."
scope = "ppl CLI"
event = "ppl boundary set"
enforcement = "n/a"
hook_or_check = "none"
deny_test = ""
allow_test = ""
owner = "ppl"
residual = "GAP: the disjointness check (write and forbid must not overlap) lives in schema.validate_brief only; a boundary written directly via ppl boundary set can still overlap forbid, where forbid then silently wins in check_path. Narrower than before this commit - see R-BOUNDARY-SET-NO-WILDCARD, which closes the non-emptiness sibling gap (a wildcard write boundary) that used to sit alongside this one"

[[rule]]
id = "R-BOUNDARY-SET-NO-WILDCARD"
statement = "ppl boundary set refuses a write boundary containing \"**\", which would match every path in the tree and make the done gate's diff-boundary check (condition 4) unconditionally true."
scope = "ppl CLI"
event = "ppl boundary set"
enforcement = "blocking"
hook_or_check = "ppl/cli.py:cmd_boundary"
deny_test = "tests/test_cli.py::TestCli::test_boundary_set_refuses_a_wildcard_write_boundary"
allow_test = "tests/test_cli.py::TestCli::test_boundary_set_still_accepts_a_narrow_glob"
owner = "ppl"
residual = "N5, cycle 2 wave B: before this fix, cmd_boundary checked only that write was non-empty - {\"write\": [\"**\"]} was accepted, and this command can be called AFTER a verdict already passed, the same shape as the C3 baseline attack (rewrite the criterion the gate reads, then run the gate). Refused at the narrowest point that closes the degenerate case outright; a merely-too-wide-but-not-\"**\" glob (e.g. an overly broad but legitimate-looking directory) is not judged here - see R-BOUNDARY-SET-DISJOINT for the sibling gap this does not close. REOPENED AND REVERSED in cycle 2 wave F: wave B also decided a boundary change should NOT stale an already-recorded PASS, on the reasoning that done_blockers re-reads boundary.json fresh on every call. That freshness is exactly the property the acceptance-shrink defect (R-BRIEF-SPEC-REVISION-STALE) exploited - a criterion the gate re-reads live can be rewritten by the same session being gated to fit a diff that already exists - and widening the write boundary to cover a path an already-produced diff had already escaped to is that same move with a different noun. cmd_boundary now rebinds spec_revision too (R-BOUNDARY-SPEC-REVISION-STALE), so any boundary edit - widen, narrow or an honest correction alike - stales an outstanding verdict the same way a name_contract or acceptance edit does. The low-cost-narrowing convenience wave B optimized for is traded away deliberately: judging widen-vs-narrow case by case would need a general superset check on arbitrary globs this codebase has no way to compute, and a false-deny (an unnecessary re-verification) is recoverable while the false-allow wave B's ruling left open was not"

[[rule]]
id = "R-BOUNDARY-SPEC-REVISION-STALE"
statement = "ppl boundary set rebinds spec_revision (using the run's current name_contract and acceptance, combined with the new write/forbid lists) whenever a spec_revision is already bound, so a boundary edit made after a PASS verdict was recorded - widening, narrowing or an honest correction alike - stales that verdict through the same ppl transition done staleness check R-BRIEF-SPEC-REVISION-STALE uses for name_contract and acceptance. A no-op boundary rewrite (byte-identical write/forbid content) does not change the fingerprint and does not stale anything."
scope = "ppl CLI"
event = "ppl boundary set, ppl transition done"
enforcement = "blocking"
hook_or_check = "ppl/cli.py:cmd_boundary, ppl/schema.py:spec_revision, ppl/verdict.py:done_blockers"
deny_test = "tests/test_cli.py::TestBoundaryChangeSpecRevisionStaleness::test_widening_the_write_boundary_after_a_pass_stales_the_verdict"
allow_test = "tests/test_cli.py::TestBoundaryChangeSpecRevisionStaleness::test_rewriting_the_boundary_to_the_same_content_does_not_stale_the_verdict"
owner = "ppl"
residual = "Skipped when no spec_revision has ever been bound (no ppl brief set yet, or a boundary-only run with none planned): there is no name_contract or acceptance to combine the new boundary with, and R-DONE-REQUIRES-BRIEF already refuses such a run at ppl transition done regardless of what its boundary says. Reads brief.json with a {} default rather than requiring one to exist, for the same reason. Deliberately does not distinguish a widening from a narrowing - see R-BOUNDARY-SET-NO-WILDCARD's residual for why that distinction was not attempted."

[[rule]]
id = "R-INIT-ONCE"
statement = "ppl init refuses to overwrite an existing run."
scope = "ppl CLI"
event = "ppl init"
enforcement = "blocking"
hook_or_check = "ppl/run.py:init"
deny_test = "tests/test_run.py::TestRun::test_init_twice_is_refused"
allow_test = "tests/test_run.py::TestRun::test_init_creates_state_at_admission"
owner = "ppl"
residual = ""

[[rule]]
id = "R-TASK-ID-TRAVERSAL"
statement = "A task id that does not match the generic KEY-123 shape is refused, so no run path can be steered out of runs/."
scope = "ppl CLI, panel, hook"
event = "every path built from a task id"
enforcement = "blocking"
hook_or_check = "ppl/paths.py:check_task_id"
deny_test = "tests/test_store.py::TestPaths::test_run_dir_rejects_traversal"
allow_test = "tests/test_store.py::TestPaths::test_run_dir_is_under_runs"
owner = "ppl"
