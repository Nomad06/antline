scope = "every hook call, under an interpreter older than 3.11"
event = "PreToolUse, SubagentStart and SubagentStop, before the ppl imports"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_python_floor.py:refuse_old_python, ppl/_assets/hooks/ppl_guard.py, ppl/_assets/hooks/ppl_dispatch.py, ppl/_assets/hooks/ppl_usage.py"
deny_test = "tests/test_guard.py::TestPythonFloor::test_an_old_python_denies_a_role_and_names_the_version, tests/test_guard.py::TestPythonFloor::test_every_generated_role_and_any_other_ppl_name_is_denied, tests/test_guard.py::TestPythonFloor::test_the_hooks_deny_a_role_under_the_system_python, tests/test_guard.py::TestPythonFloor::test_the_hooks_start_with_their_own_directory_off_sys_path"
