[[rule]]
id = "R-METRIC-SCANS-ARCHIVE"
statement = "Every metrics.py reader, and record_label's existence check, sees a run archived by ppl destroy --scope local as well as a live one; labels are stored outside the run directory entirely so ppl destroy never moves or loses them."
scope = "ppl CLI"
