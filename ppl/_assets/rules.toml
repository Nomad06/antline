residual = "the md files are untrusted text a model reads: the item checks drop an interpreter or absolute program, a goal that is not a plain word and any control or format character, and what remains is lexical - npx can run a dotted package name it is given, an env prefix carries any value once the files name a build variable, and gate commands are shell by design, reviewed in the form and not decided by the model, and a bare flag the tool reads as a write or exec target still passes (go test -o x.bin)"

[[rule]]
id = "R-STUDIO-SAME-VALIDATION"
statement = "A harness draft the studio checks or installs, and a harness file it saves, is refused by the same harness.verify that ppl harness validate runs (validation, an absolute repo.path, the skill and every agent file rendered with role-tool composition, the size caps), and both return the same errors and warnings for the same harness, so a draft that grants a role a tracker write tool or a joined tool list is refused in the browser as it is on the command line. Install writes the request's draft to a private directory, validates that copy and hands it to the setup harness step, and a draft name ending, in any letter case, in .git, .replacing or .replaced is refused before anything is written. The same name rule, harness.check_name, holds on every path that installs a harness: the setup harness step from the browser and the terminal, for a given or a defaulted name, ppl harness add, and the studio's add and create. The setup harness step also refuses a harness source that is not an example or installed harness name, a git URL or an absolute path, before it copies anything."
scope = "panel"
event = "POST /api/harness/draft/check, POST /api/harness/draft/install, POST /api/setup/harness, ppl setup harness, ppl harness add"
enforcement = "blocking"
hook_or_check = "ppl/studio/drafts.py:check, ppl/studio/drafts.py:install, ppl/harness.py:verify, ppl/studio/drafts.py:verify, ppl/studio/files.py:check_harness, ppl/cli.py:cmd_harness, ppl/harness.py:validate, ppl/routing.py:role_tools, ppl/studio/drafts.py:check_name, ppl/harness.py:check_name, ppl/harness.py:add, ppl/setup.py:_check_source"
deny_test = "tests/test_studio_drafts.py::TestCheck::test_a_draft_granting_a_tracker_write_tool_is_refused, tests/test_studio_drafts.py::TestCheck::test_a_draft_granting_a_joined_tool_list_is_refused, tests/test_studio_drafts.py::TestInstall::test_install_refuses_an_invalid_draft_before_setup_runs, tests/test_studio_drafts.py::TestCheck::test_a_joined_forge_server_name_is_refused_by_role_tool_composition, tests/test_studio_drafts.py::TestCheck::test_the_names_setup_keeps_for_its_own_directories_are_refused, tests/test_studio_drafts.py::TestCheck::test_the_reserved_endings_are_refused_in_any_letter_case, tests/test_studio_drafts.py::TestInstall::test_install_refuses_a_reserved_name_before_it_writes_anything, tests/test_studio_drafts.py::TestDraftRoutes::test_the_install_route_refuses_a_reserved_name_at_once, tests/test_harness.py::TestAddEdges::test_check_name_takes_a_plain_name_and_refuses_the_reserved_endings_in_any_case, tests/test_harness.py::TestAddEdges::test_add_refuses_a_reserved_name_unless_it_is_setups_own_staging, tests/test_harness.py::TestHarnessCli::test_add_refuses_a_name_setup_keeps_for_its_own_directories, tests/test_setup.py::TestNonInteractive::test_a_reserved_harness_name_given_or_defaulted_is_refused_before_any_copy, tests/test_setup.py::TestNonInteractive::test_a_relative_harness_source_is_refused_before_any_copy, tests/test_setup.py::TestCli::test_the_harness_step_refuses_a_reserved_name_or_a_relative_source, tests/test_studio_wizard.py::TestWizardApi::test_the_harness_route_refuses_a_name_setup_keeps_so_no_install_deletes_it_later, tests/test_studio_wizard.py::TestWizardApi::test_the_harness_route_refuses_a_relative_source_before_any_copy, tests/test_studio_drafts.py::TestSameAnswerAsTheCli::test_a_draft_the_cli_refuses_is_refused_in_the_studio, tests/test_studio_files.py::TestCheckHarness::test_a_file_ppl_never_reads_gets_the_answer_the_cli_gives"
allow_test = "tests/test_studio_drafts.py::TestCheck::test_a_preset_draft_checks_clean, tests/test_studio_drafts.py::TestSameAnswerAsTheCli::test_the_cli_and_the_studio_return_the_same_errors_and_warnings, tests/test_studio_drafts.py::TestInstall::test_a_concurrent_check_does_not_change_what_install_installs, tests/test_setup.py::TestNonInteractive::test_a_home_relative_harness_source_is_taken"
owner = "panel"
residual = "the flags the form shows for a permissive shape are advice, not a refusal: a user who ticks them installs the shape, and the guard enforces it as written"

[[rule]]
