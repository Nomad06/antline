[[rule]]
id = "R-VERIFICATION-UNAVAILABLE-PARK"
statement = "ppl verdict record refuses to let a second consecutive INCONCLUSIVE/ERROR/CANCELLED/TIMEOUT verdict on the same candidate_sha pass silently: it parks the run with blocker VERIFICATION_UNAVAILABLE and exits 2, rather than let a broken verifier masquerade as an undecided candidate forever."
scope = "ppl CLI"
event = "ppl verdict record"
enforcement = "blocking"
hook_or_check = "ppl/verdict.py:record, ppl/verdict.py:_previous_verdict_outcome, ppl/schema.py:INCOMPLETE_OUTCOMES"
deny_test = "tests/test_verdict.py::TestVerificationUnavailablePark::test_two_consecutive_incomplete_verdicts_on_the_same_sha_park, tests/test_verdict.py::TestVerificationUnavailablePark::test_two_different_incomplete_outcomes_in_a_row_still_count"
allow_test = "tests/test_verdict.py::TestVerificationUnavailablePark::test_a_single_incomplete_verdict_does_not_park, tests/test_verdict.py::TestVerificationUnavailablePark::test_an_incomplete_verdict_right_after_a_real_outcome_does_not_park, tests/test_verdict.py::TestVerificationUnavailablePark::test_the_verdict_is_still_durably_recorded_even_though_it_parks"
owner = "ppl"
residual = "the recurrence is read from log.jsonl's append-only verdict-event trail for this exact sha, so a direct Python caller of verdict.record that never goes through log.jsonl at all - none exists today - would bypass it, the same CLI-level scope R-LEASE-STALE-WRITE already carries"

