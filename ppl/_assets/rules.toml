[[rule]]
id = "R-STUDIO-PLAYGROUND-SANDBOX"
statement = "The cage playground builds its run under a temporary data root and runs the real hook against it, so a check never touches the real runs directory."
scope = "panel"
event = "POST /api/playground"
enforcement = "n/a"
hook_or_check = "none"
deny_test = ""
allow_test = ""
owner = "panel"
residual = "PROPERTY: playground.check hands the hook and the child a PPL_HOME made by tempfile.TemporaryDirectory and an environment with no other PPL_ variable but PPL_ROOT, and deletes the directory when the hook has answered, when the check is refused, when the hook times out and when an exception is raised. These tests hold it: tests/test_studio_playground.py::TestPlayground::test_the_playground_leaves_no_files_behind, tests/test_studio_playground.py::TestPlayground::test_the_hook_and_the_child_get_the_throwaway_data_root_and_no_other_ppl_variable, tests/test_studio_playground.py::TestPlayground::test_a_value_naming_a_real_path_is_never_performed, tests/test_studio_playground.py::TestPlayground::test_the_throwaway_root_is_removed_when_the_hook_has_answered, tests/test_studio_playground.py::TestPlayground::test_the_throwaway_root_is_removed_when_the_draft_is_refused, tests/test_studio_playground.py::TestPlayground::test_the_throwaway_root_is_removed_when_the_run_cannot_be_built, tests/test_studio_playground.py::TestPlayground::test_the_throwaway_root_is_removed_when_the_hook_times_out, tests/test_studio_playground.py::TestPlayground::test_the_throwaway_root_is_removed_when_an_exception_is_raised_mid_check. Nothing refuses a change that would point the playground at the real data root other than those tests. The playground answers about the harness and the boundary, not about the whole cage: the throwaway runs directory is not ~/.ppl/runs, so a write to the real run's state reads allow, the fake run sits at admission, so the Jira gate always reads deny, a value over 4096 characters is refused before the hook, and the hook cites no rule ids, so the rules list is usually empty"

# ---------------------------------------------------------------------------
# Done gate
# ---------------------------------------------------------------------------

[[rule]]
id = "R-DONE-GATE"
statement = "ppl transition done refuses unless all seven conditions hold, and no argument overrides it."
scope = "ppl CLI"
event = "ppl transition done"
enforcement = "blocking"
hook_or_check = "ppl/verdict.py:done_blockers, ppl/cli.py:cmd_transition"
deny_test = "tests/test_verdict.py::TestVerdict::test_done_blocked_without_verdict, tests/test_cli.py::TestTransitionOrdering::test_an_illegal_lifecycle_target_is_reported_before_the_done_gate_runs"
allow_test = "tests/test_verdict.py::TestVerdict::test_done_allowed_when_everything_holds"
owner = "ppl"
residual = "six of the seven read documents the same session wrote; only the head SHA and the base-to-head diff come from git. N4, cycle 2 wave B: cmd_transition now checks fsm.check_lifecycle BEFORE running done_blockers, so an already-illegal lifecycle target (still planned, say) is reported as ILLEGAL_TRANSITION rather than whatever confusing error the done gate happened to trip over first (EXTERNAL_BLOCKED for a missing base_sha, concretely) - a cheap, always-available check ordered ahead of an expensive one that can fail for unrelated reasons"

[[rule]]
id = "R-DONE-FROM-CLOSURE"
statement = "ppl transition done is refused with ILLEGAL_TRANSITION naming closure unless the run's stage is closure, so a run cannot end with stage review and status done."
scope = "ppl CLI"
event = "ppl transition done"
enforcement = "blocking"
hook_or_check = "ppl/cli.py:cmd_transition"
deny_test = "tests/test_cli.py::TestDoneOnlyFromClosure::test_transition_done_from_review_is_refused_naming_closure, tests/test_cli.py::TestDoneOnlyFromClosure::test_transition_done_before_review_names_no_impossible_step, tests/test_cli.py::TestDoneOnlyFromClosure::test_transition_done_from_merge_watch_is_refused_too, tests/test_skill_contract.py::TestSequences::test_the_walk_refuses_the_two_step_ending_the_review_loop_once_had"
allow_test = "tests/test_cli.py::TestNameContractSpecRevision::test_transition_done_succeeds_when_the_name_contract_never_changed, tests/test_cli.py::TestDoneOnlyFromClosure::test_other_lifecycle_targets_are_not_tied_to_closure"
owner = "ppl"
residual = "checked after fsm.check_lifecycle and before the done gate, so a lifecycle target illegal on its face is still reported first. The refusal names a step legal from the current stage: ppl stage enter closure from review, escalation from merge_watch (which has no way back, see R-MERGE-WATCH-AFTER-DONE), and otherwise that closure follows review. The other lifecycle targets (blocked, failed) are not tied to a stage. A run enters closure only when the done gate passes (R-CLOSURE-ONLY-WHEN-DONE-PASSES), so a done gate that refuses in closure means something changed after the run entered it: closure has no edge back to Stage 3, so the run repairs in place (the receipt, the verdict or the finding status on the current head) and runs ppl transition done again, or escalates OWNER_DECISION"

[[rule]]
id = "R-CLOSURE-ONLY-WHEN-DONE-PASSES"
statement = "ppl stage enter closure, a resume from parking or escalation included, is refused with ILLEGAL_TRANSITION naming the done gate's blockers while verdict.done_blockers for the current head is non-empty, so a run enters closure, which leads only to ppl transition done and has no edge back to Stage 3, only when the done gate would pass at that moment. The run stays where it was: in review, where rework and evidence repair are still possible, or, on a resume, in parking or escalation, where the evidence can be repaired or OWNER_DECISION escalated."
scope = "ppl CLI"
event = "ppl stage enter closure"
enforcement = "blocking"
hook_or_check = "ppl/run.py:stage_enter, ppl/verdict.py:current_blockers"
deny_test = "tests/test_cli.py::TestClosureOnlyWhenDonePasses::test_entering_closure_while_the_done_gate_refuses_is_refused_naming_the_blockers, tests/test_cli.py::TestClosureOnlyWhenDonePasses::test_resuming_into_closure_while_the_done_gate_refuses_is_refused, tests/test_skill_contract.py::TestSequences::test_the_walk_refuses_closure_while_the_done_gate_would_refuse"
allow_test = "tests/test_cli.py::TestNameContractSpecRevision::test_a_run_whose_done_gate_passes_enters_closure_and_closes, tests/test_cli.py::TestClosureOnlyWhenDonePasses::test_a_run_refused_closure_can_still_go_back_to_stage_three"
owner = "ppl"
residual = "checked at entry only, through the same verdict.current_blockers ppl transition done reads: a head, receipt, verdict or finding that changes after the run entered closure is caught by the done gate itself, and the run then repairs in place or escalates OWNER_DECISION (R-DONE-FROM-CLOSURE). A run parked or escalated out of closure resumes there only once the gate passes again, and the evidence commands carry no stage gate, so the repair can happen while it is parked. tests/test_skill_contract.py's walk stubs verdict.done_blockers, which this check and the done gate share, to the blockers a walk passes, none by default, so every walked sequence models a run whose evidence holds, and one walk passes a blocker to show the refusal"

[[rule]]
id = "R-MERGE-WATCH-AFTER-DONE"
statement = "ppl stage enter merge_watch is refused with ILLEGAL_TRANSITION unless the run's lifecycle status is done, so no run sits in merge_watch, which has no way back to closure, without having passed the done gate."
scope = "ppl CLI"
event = "ppl stage enter merge_watch"
enforcement = "blocking"
hook_or_check = "ppl/run.py:stage_enter"
deny_test = "tests/test_run.py::TestMergeWatchAfterDone::test_entering_merge_watch_before_the_run_is_done_is_refused, tests/test_skill_contract.py::TestSequences::test_the_walk_follows_the_lifecycle_status_as_well_as_the_stage"
allow_test = "tests/test_run.py::TestMergeWatchAfterDone::test_entering_merge_watch_once_the_run_is_done_is_allowed, tests/test_watchdog.py::TestWatchdogCheck::test_merge_watch_is_exempt_even_past_its_deadline"
owner = "ppl"
residual = "applies to every entry, a resume from parking included. A run that reached merge_watch before this check, with status other than done, stays there: ppl transition done refuses it outside closure and points it at escalation"

[[rule]]
id = "R-DONE-VERDICT-PASS"
statement = "Done condition 1: a verdict exists for the candidate and its verdict is PASS - REWORK, BLOCKED, OWNER_DECISION, INCONCLUSIVE, ERROR, CANCELLED and TIMEOUT are all refused as not-PASS by the same equality check, because a check that did not happen is neither evidence the candidate is bad nor evidence it is good."
scope = "ppl CLI"
event = "ppl transition done"
enforcement = "blocking"
hook_or_check = "ppl/verdict.py:done_blockers"
deny_test = "tests/test_verdict.py::TestVerdict::test_done_blocked_when_verdict_is_not_pass, tests/test_verdict.py::TestVerdict::test_done_blocked_when_verdict_is_inconclusive, tests/test_verdict.py::TestVerdict::test_done_blocked_when_verdict_is_error, tests/test_verdict.py::TestVerdict::test_done_blocked_when_verdict_is_cancelled, tests/test_verdict.py::TestVerdict::test_done_blocked_when_verdict_is_timeout"
allow_test = "tests/test_verdict.py::TestVerdict::test_done_allowed_when_everything_holds"
owner = "ppl"
residual = "the verdict document is written by the same session that ran the checks"

[[rule]]
id = "R-DONE-SHA-BINDING"
statement = "Done condition 2: a verdict is bound to the git head it was produced on, and a verdict for another SHA is refused."
scope = "ppl CLI"
event = "ppl verdict record, ppl transition done"
enforcement = "blocking"
hook_or_check = "ppl/verdict.py:record, ppl/gitfacts.py:head_sha"
deny_test = "tests/test_verdict.py::TestVerdict::test_record_refuses_a_verdict_for_another_sha"
allow_test = "tests/test_verdict.py::TestVerdict::test_record_stores_a_matching_verdict"
