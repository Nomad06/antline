residual = "the client-sent paths are the wizard's project path, workspace and harness source, the harness add source, and the playground's value and draft repo path. The project path is read only (inspected with git and walked for md files, never written), the wizard's harness source is an example or installed harness name, a git URL or an absolute path, the harness add source is a git URL that harness.add clones or an absolute local directory it copies with symlinks followed, into the new harness directory only, and the playground's value and repo path are resolved and read only, against a throwaway run. One client-sent value is a program: claude_binary, the Claude Code step's answer, is executed later by the models step's probe, the extraction and the version check behind the Agents page, as the CLI's setup executes the same answer"

[[rule]]
id = "R-STUDIO-CHANGED-ON-DISK"
