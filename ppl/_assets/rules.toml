# The rule matrix. One row per rule this pipeline claims to hold.
#
# Read by ppl/rules.py and asserted by tests/test_rule_matrix.py:
#   - a blocking row must name a deny test that exists and that names this id
#   - an n/a row must carry a residual that says which kind of gap it is
#   - every enforcement sentence in docs/DESIGN.md must name a row id
#   - a blocking or soft row must name a check that really exists in the tree
#
# enforcement: blocking = code refuses the action
#              soft     = code notices, warns or filters, the action still goes through
#              n/a      = nothing in this pipeline enforces it
# residual:    GAP:      needed and not built (counted as a hole)
#              PROPERTY: a stated fact with nothing here to enforce
# owner:       who is accountable for the rule holding, or for the residual biting

# ---------------------------------------------------------------------------
# Role write boundaries
# ---------------------------------------------------------------------------

[[rule]]
id = "R-ROLE-CODE-WORKER-TESTS"
statement = "ppl-code-worker may not write a test source, a path the run's test patterns (snapshot `[tests]`, Java defaults when absent) match, anywhere in the tree - through a structured edit tool or through a write-shaped Bash construct."
scope = "active run, agent_type ppl-code-worker"
event = "PreToolUse on Edit/Write/MultiEdit/NotebookEdit, and on Bash for a redirect/tee/sed -i/cp/mv/dd/rm whose target lands inside the repo"
enforcement = "blocking"
hook_or_check = "ppl/boundary.py:check_path, ppl/_assets/hooks/ppl_guard.py:decide, ppl/_assets/hooks/ppl_guard.py:bash_write_boundary_deny"
deny_test = "tests/test_guard.py::TestGuard::test_code_worker_may_not_edit_a_test, tests/test_boundary.py::TestCodeWorker::test_rejects_test_sources_even_inside_boundary, tests/test_guard.py::TestGuard::test_code_worker_bash_redirect_into_a_test_source_is_denied, tests/test_guard.py::TestGuard::test_code_worker_cp_into_a_test_source_is_denied, tests/test_guard_patterns.py::TestPythonRun::test_the_code_worker_may_not_write_a_python_test"
allow_test = "tests/test_guard.py::TestGuard::test_code_worker_may_edit_inside_boundary"
owner = "guard-hook"
residual = "inert until the hook is registered, see R-GUARD-NOT-ARMED. The Bash half is lexical, like every other Bash check in this module: an interpreter invocation (python3 -c \"open(path,'w').write(...)\") writes the same path and is not caught - see R-GUARD-BASH-WRITE-BOUNDARY"

[[rule]]
id = "R-ROLE-CODE-WORKER-BOUNDARY"
statement = "ppl-code-worker may write only paths matching boundary.write - through a structured edit tool or through a write-shaped Bash construct."
scope = "active run, agent_type ppl-code-worker"
event = "PreToolUse on Edit/Write/MultiEdit/NotebookEdit, and on Bash for a redirect/tee/sed -i/cp/mv/dd/rm whose target lands inside the repo"
enforcement = "blocking"
hook_or_check = "ppl/boundary.py:check_path, ppl/_assets/hooks/ppl_guard.py:bash_write_boundary_deny"
deny_test = "tests/test_boundary.py::TestCodeWorker::test_rejects_path_outside_write_boundary, tests/test_guard.py::TestGuard::test_code_worker_bash_write_outside_the_write_boundary_is_denied"
allow_test = "tests/test_boundary.py::TestCodeWorker::test_allows_path_inside_write_boundary, tests/test_guard.py::TestGuard::test_code_worker_bash_redirect_inside_boundary_is_still_allowed"
owner = "guard-hook"
residual = "inert until the hook is registered, see R-GUARD-NOT-ARMED. The Bash half is lexical - see R-GUARD-BASH-WRITE-BOUNDARY for exactly what it does and does not catch"

[[rule]]
id = "R-ROLE-TEST-WORKER-MAIN"
statement = "ppl-test-worker may write test sources only, the paths the run's test patterns (snapshot `[tests]`, Java defaults when absent) match, never a main source - through a structured edit tool or through a write-shaped Bash construct. A write target with a .. segment denies for the test worker, since .. is collapsed before a symlink is followed."
scope = "active run, agent_type ppl-test-worker"
event = "PreToolUse on Edit/Write/MultiEdit/NotebookEdit, and on Bash for a redirect/tee/sed -i/cp/mv/dd/rm whose target lands inside the repo"
enforcement = "blocking"
hook_or_check = "ppl/boundary.py:check_path, ppl/_assets/hooks/ppl_guard.py:decide, ppl/_assets/hooks/ppl_guard.py:bash_write_boundary_deny"
deny_test = "tests/test_guard.py::TestGuard::test_test_worker_may_not_edit_main_source, tests/test_boundary.py::TestTestWorker::test_rejects_main_sources, tests/test_guard.py::TestGuard::test_test_worker_bash_redirect_into_a_main_source_is_denied_absolute, tests/test_guard.py::TestGuard::test_test_worker_bash_redirect_into_a_main_source_is_denied_relative, tests/test_guard_patterns.py::TestPythonRun::test_the_test_worker_may_not_write_product_code, tests/test_guard_patterns.py::TestPythonRun::test_a_test_worker_write_with_dotdot_is_denied"
allow_test = "tests/test_boundary.py::TestTestWorker::test_allows_test_sources, tests/test_guard.py::TestGuard::test_test_worker_bash_redirect_into_a_test_source_is_still_allowed, tests/test_guard_patterns.py::TestPythonRun::test_the_test_worker_may_write_a_python_test"
owner = "guard-hook"
residual = "inert until the hook is registered, see R-GUARD-NOT-ARMED. The Bash half is lexical - an interpreter invocation is not caught, see R-GUARD-BASH-WRITE-BOUNDARY. A symlink inside a test directory that points at product code is followed where the lexical check cannot see it: a path through it is resolved by realpath and judged where it lands (cat tests/link/cart.py and a Read or Write of it deny) and a .. path is refused for the test worker, but a glob that expands through it (cat tests/*/cart.py, a redirect into tests/*/x) and a read that follows links (grep -R, the Grep and Glob tools wherever they follow links) still reach what it points at. The test worker cannot create one (ln is outside its Bash allowlist, the code worker may not write test paths) except through running its own tests, the accepted R-TEST-WORKER-EXECUTION-CHANNEL residual, or when the repository itself commits such a link"

[[rule]]
id = "R-ROLE-READONLY-NO-WRITE"
statement = "ppl-briefer, ppl-brief-challenger, ppl-verifier and ppl-review-responder may write no path at all."
scope = "active run, read-only roles"
event = "PreToolUse on Edit/Write/MultiEdit/NotebookEdit"
enforcement = "blocking"
hook_or_check = "ppl/boundary.py:ROLE_RULES, ppl/boundary.py:check_path"
deny_test = "tests/test_guard.py::TestGuard::test_verifier_may_not_write_anything, tests/test_guard.py::TestGuard::test_brief_challenger_may_not_write_anything, tests/test_boundary.py::TestReadOnlyRoles::test_verifier_may_write_nothing, tests/test_boundary.py::TestReadOnlyRoles::test_every_read_only_role_may_write_nothing"
allow_test = ""
owner = "guard-hook"
residual = "inert until the hook is registered, see R-GUARD-NOT-ARMED"

[[rule]]
id = "R-ROLE-TOOLS-READONLY"
statement = "The generated agent file for a read-only role grants no Edit, Write or Bash tool. The one exception is Bash for ppl-review-responder under a forge whose adapter grants it (github), where the hook caps it to the forge's read shapes, see R-REVIEW-RESPONDER-BASH-SHAPES."
scope = "global, every dispatch of that role"
event = "ppl routing apply"
enforcement = "blocking"
hook_or_check = "ppl/routing.py:BASE_TOOLS, ppl/routing.py:role_tools, ppl/routing.py:render"
deny_test = "tests/test_routing.py::TestRouting::test_read_only_roles_get_no_write_tools, tests/test_routing.py::TestRouting::test_verifier_gets_no_bash, tests/test_routing.py::TestRouting::test_only_the_review_responder_may_hold_bash_and_only_under_a_granting_forge, tests/test_harness.py::TestMalformedInputIsRefusedNotATraceback::test_a_built_in_tool_cannot_be_granted_through_extra_tools"
allow_test = "tests/test_routing.py::TestRouting::test_code_worker_gets_edit_tools"
owner = "ppl"
residual = "the allow-list is real only after ppl routing apply has been run against the live agents directory"

[[rule]]
id = "R-ROLE-FORBIDDEN-PATHS"
statement = "A path matching boundary.forbid is denied even when it also matches boundary.write - through a structured edit tool or through a write-shaped Bash construct."
scope = "active run, any writing role"
event = "PreToolUse on Edit/Write/MultiEdit/NotebookEdit, and on Bash for a redirect/tee/sed -i/cp/mv/dd/rm whose target lands inside the repo"
enforcement = "blocking"
hook_or_check = "ppl/boundary.py:check_path, ppl/_assets/hooks/ppl_guard.py:bash_write_boundary_deny"
deny_test = "tests/test_boundary.py::TestCodeWorker::test_rejects_forbidden_even_if_write_pattern_matches, tests/test_guard.py::TestGuard::test_code_worker_bash_write_to_a_forbidden_path_is_denied"
allow_test = ""
owner = "guard-hook"
residual = "the Bash half is lexical - an interpreter invocation is not caught, see R-GUARD-BASH-WRITE-BOUNDARY"

[[rule]]
id = "R-PATH-TRAVERSAL"
statement = "A write path containing a .. segment is denied."
scope = "active run, any writing role"
event = "PreToolUse on Edit/Write/MultiEdit/NotebookEdit, ppl apply-patch"
enforcement = "blocking"
hook_or_check = "ppl/boundary.py:check_path"
deny_test = "tests/test_boundary.py::TestCodeWorker::test_rejects_path_with_traversal_sequence, tests/test_boundary.py::TestDiff::test_check_diff_rejects_crafted_traversal_path"
allow_test = ""
owner = "guard-hook"
residual = ""

[[rule]]
id = "R-PATH-ABSOLUTE"
statement = "An absolute write path is denied, since it cannot be checked against a relative boundary."
scope = "active run, any writing role"
event = "PreToolUse on Edit/Write/MultiEdit/NotebookEdit, ppl apply-patch"
enforcement = "blocking"
hook_or_check = "ppl/boundary.py:check_path"
deny_test = "tests/test_boundary.py::TestCodeWorker::test_rejects_absolute_path"
allow_test = ""
owner = "guard-hook"
residual = ""

[[rule]]
id = "R-ROLE-OUTSIDE-REPO"
statement = "A ppl-* role's structured edit tool call (Edit/Write/MultiEdit/NotebookEdit) may write only inside the active run's repo, whatever its session's cwd."
scope = "active run, any ppl-* role"
event = "PreToolUse on Edit/Write/MultiEdit/NotebookEdit"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:decide, ppl/_assets/hooks/ppl_guard.py:targets_repo"
deny_test = "tests/test_guard.py::TestGuard::test_role_write_outside_the_repo_is_denied, tests/test_guard.py::TestGuard::test_role_outside_any_run_repo_is_still_denied_regardless_of_isolation"
allow_test = "tests/test_guard.py::TestGuard::test_role_write_into_the_repo_is_denied_from_any_cwd"
owner = "guard-hook"
residual = "does NOT extend to Bash by the same shape: R-GUARD-BASH-WRITE-BOUNDARY deliberately does not deny a role's Bash write that lands OUTSIDE the repo (a role's Bash legitimately writes build logs and rc files there, e.g. gates.md's own recipe), so an out-of-repo target is not itself a violation for Bash the way it is for a structured edit tool - see test_code_worker_bash_write_outside_the_repo_is_unaffected"

[[rule]]
id = "R-UNROLED-REPO-WRITE"
statement = "A session with no agent_type, the orchestrator included, may not write repo code inside an active run's repo - through a structured edit tool or through a write-shaped Bash construct, whatever its session's cwd."
scope = "active run, session with no agent_type"
event = "PreToolUse on Edit/Write/MultiEdit/NotebookEdit, and on Bash for a redirect/tee/sed -i/cp/mv/dd/rm whose target lands inside the repo"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:decide, ppl/_assets/hooks/ppl_guard.py:bash_write_boundary_deny"
deny_test = "tests/test_guard.py::TestGuard::test_absent_agent_type_writing_inside_the_run_repo_is_denied, tests/test_guard.py::TestGuard::test_unrecognised_agent_writing_inside_the_run_repo_is_denied, tests/test_guard.py::TestGuard::test_unroled_bash_redirect_into_the_run_repo_is_denied"
allow_test = "tests/test_guard.py::TestGuard::test_unroled_ordinary_write_outside_repo_is_still_untouched_when_isolated"
owner = "guard-hook"
residual = "the Bash half is lexical and, unlike the structured-tool half, only fires when the target actually resolves inside the repo (see R-ROLE-OUTSIDE-REPO's residual on why); an interpreter invocation is not caught either - see R-GUARD-BASH-WRITE-BOUNDARY"

# ---------------------------------------------------------------------------
# Global denials: git landmines, MCP tools, runs/
# ---------------------------------------------------------------------------

[[rule]]
id = "R-GUARD-GLOBAL-DENIALS"
statement = "The denied MCP tools, the repo landmines and the runs/ write protection are decided before any run is looked up, so they fire with no active run at all."
scope = "global, no run required"
event = "PreToolUse, before active_state()"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:decide"
deny_test = "tests/test_guard.py::TestGuard::test_landmine_denies_apply_even_outside_the_run_directory"
allow_test = ""
owner = "guard-hook"
residual = ""

[[rule]]
id = "R-GIT-ADD-ALL"
statement = "git add -A, git add --all and git add . are denied: git add -A can sweep a live credential into a commit, add explicit paths."
scope = "global, no run required"
event = "PreToolUse on Bash"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:DENIED_COMMANDS"
deny_test = "tests/test_guard.py::TestGuard::test_git_add_all_is_denied_for_every_agent, tests/test_guard.py::TestGuard::test_add_all_bypass_via_global_dir_flag_is_denied, tests/test_guard.py::TestGuard::test_add_all_bypass_via_c_flag_is_denied"
allow_test = ""
owner = "guard-hook"
residual = "a regex over the command string, so a shell construct it does not model (an alias, a variable, a here-doc) is not seen"

[[rule]]
id = "R-GIT-STASH"
statement = "Bare git stash, git stash pop, git stash clear and a git stash drop that names no stash@{N} are denied: the stash stack is shared across worktrees and other sessions. The shared-stack recipe is push -m <tag>, apply <sha>, then drop the entry by the index it is re-found at, so git stash drop stash@{N} is allowed, while a bare drop takes the top entry, which is likely another session's."
scope = "global, no run required"
event = "PreToolUse on Bash"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:DENIED_COMMANDS"
deny_test = "tests/test_guard.py::TestGuard::test_bare_git_stash_is_denied, tests/test_guard.py::TestGuard::test_stash_pop_bypass_via_global_dir_flag_is_denied, tests/test_guard.py::TestGuard::test_git_stash_clear_and_a_bare_drop_are_denied, tests/test_guard.py::TestGuard::test_git_stash_pop_is_still_denied, tests/test_guard.py::TestGuard::test_the_stash_drop_shape_stays_fast_on_decoys"
allow_test = "tests/test_guard.py::TestGuard::test_named_git_stash_push_is_allowed, tests/test_guard.py::TestGuard::test_the_stash_commands_that_leave_the_stack_alone_are_allowed, tests/test_guard.py::TestGuard::test_a_stash_drop_naming_its_entry_is_allowed"
owner = "guard-hook"
residual = "a regex over the command string, same limit as R-GIT-ADD-ALL. An explicit drop is trusted to name the caller's own entry: git stash drop stash@{N} with the wrong N still drops another session's stash, and a drop by a bare number (git stash drop 3) is denied, name it stash@{3}"

[[rule]]
id = "R-GIT-FORCE-PUSH"
statement = "git push --force, its -f shorthand (alone or inside a short-option cluster) and a refspec with a leading + (+main, +HEAD:main) are denied: a force push is irreversible on a shared ref."
scope = "global, no run required"
event = "PreToolUse on Bash"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:DENIED_COMMANDS"
deny_test = "tests/test_guard.py::TestGuard::test_force_push_is_denied, tests/test_guard.py::TestGuard::test_force_push_shorthand_f_is_denied, tests/test_guard.py::TestGuard::test_refspec_force_push_is_denied"
allow_test = "tests/test_guard.py::TestGuard::test_plain_git_push_is_allowed, tests/test_guard.py::TestGuard::test_a_push_with_no_plus_refspec_is_still_allowed, tests/test_guard.py::TestGuard::test_the_refspec_span_stays_fast_on_fd_redirects"
owner = "guard-hook"
residual = "a regex over the command string, same limit as R-GIT-ADD-ALL. The + refspec is looked for in the push's own command only, up to the next ;, |, newline, or an & that does not belong to an fd redirect (2>&1, &>log and >&log pass, with mutually exclusive alternatives so the span stays linear), so a quoted separator inside the push's own arguments hides a later +refspec. The span shares the --force branch's .* quadratic tail per push start, disclosed by R-GUARD-ROLE-COMMAND-LENGTH and bounded for a role by the 4096-char cap"

[[rule]]
id = "R-GIT-RESET-HARD"
statement = "git reset --hard is denied: it discards worker output that has no receipt."
scope = "global, no run required"
event = "PreToolUse on Bash"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:DENIED_COMMANDS"
deny_test = "tests/test_guard.py::TestGuard::test_reset_hard_bypass_via_global_dir_flag_is_denied"
allow_test = ""
owner = "guard-hook"
residual = "a regex over the command string, same limit as R-GIT-ADD-ALL"

[[rule]]
id = "R-MCP-RESOLVE-THREAD"
statement = "The forge's resolve-thread tool (GitLab: resolve_merge_request_thread under the harness's server name) is denied: only the remark author may resolve a thread."
scope = "global, no run required"
event = "PreToolUse on the MCP tool"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:DENIED_TOOLS"
deny_test = "tests/test_guard.py::TestGuard::test_resolving_a_thread_is_denied, tests/test_guard.py::TestGuard::test_resolve_merge_and_approve_are_denied_under_the_snapshot_server_name"
allow_test = ""
owner = "guard-hook"
residual = ""

[[rule]]
id = "R-MCP-MERGE-MR"
statement = "The forge's merge tool (GitLab: merge_merge_request under the harness's server name, GitHub: merge_pull_request) is denied: the pipeline ends at approval and a human performs the merge."
scope = "global, no run required"
event = "PreToolUse on the MCP tool"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:DENIED_TOOLS"
deny_test = "tests/test_guard.py::TestGuard::test_merging_is_denied, tests/test_guard.py::TestGuard::test_resolve_merge_and_approve_are_denied_under_the_snapshot_server_name"
allow_test = ""
owner = "guard-hook"
residual = ""

[[rule]]
id = "R-MCP-APPROVE-MR"
statement = "The forge's approve tool (GitLab: approve_merge_request under the harness's server name, GitHub: the pull request review submit tools) is denied: the pipeline never approves its own merge request."
scope = "global, no run required"
event = "PreToolUse on the MCP tool"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:DENIED_TOOLS"
deny_test = "tests/test_guard.py::TestGuard::test_approving_its_own_mr_is_denied, tests/test_guard.py::TestGuard::test_resolve_merge_and_approve_are_denied_under_the_snapshot_server_name"
allow_test = ""
owner = "guard-hook"
residual = ""

[[rule]]
id = "R-FORGE-DENIALS-FROM-ADAPTER"
statement = "The denied forge tools are the union of both adapters' default denials, plus the names of the adapter the run's harness snapshot names under its configured server name."
scope = "global, widened by the active run"
event = "PreToolUse on an MCP tool"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:denied_tools, ppl/_assets/hooks/ppl_guard.py:forge_from_snapshot, ppl/forges/__init__.py:all_denied_tools"
deny_test = "tests/test_guard.py::TestGuard::test_resolve_merge_and_approve_are_denied_under_the_snapshot_server_name, tests/test_guard.py::TestGuard::test_without_a_run_both_adapters_denials_apply"
allow_test = ""
owner = "guard-hook"
residual = "GitHub MCP tool names follow the official server; another server build is covered only by the gh Bash denials. A GitLab MCP server build exposing other tool names (e.g. accept_merge_request) is covered by neither the union nor a custom mcp_server, and the gitlab adapter has no Bash denials, so `glab mr merge` is not denied"

[[rule]]
id = "R-FORGE-GH-NO-APPROVE-MERGE"
statement = "gh pr merge, gh pr review --approve and a gh api graphql call carrying resolveReviewThread are denied as Bash for every session, whatever forge the active run names or with no run at all."
scope = "global"
event = "PreToolUse on Bash"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:forge_bash_denial, ppl/forges/github.py:denied_bash"
deny_test = "tests/test_guard.py::TestGuard::test_github_merge_approve_resolve_bash_are_denied_for_everyone, tests/test_guard.py::TestGuard::test_gh_merge_is_denied_under_a_gitlab_run_too"
allow_test = ""
owner = "guard-hook"
residual = "lexical: a wrapper script around gh is not seen"

[[rule]]
id = "R-REVIEW-RESPONDER-BASH-SHAPES"
statement = "ppl-review-responder's Bash is an allowlist of the forge adapter's read shapes (github: local git -C <abs path> diff or show with --no-ext-diff --no-textconv and log --oneline, over hex SHAs or origin/<name>, never gh), and a trailing redirect other than an fd duplication or /dev/null, or a `<`/`>` anywhere in a token, denies; with the gitlab forge it has no Bash shapes and every Bash call is denied."
scope = "active run, agent_type ppl-review-responder"
event = "PreToolUse on Bash"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:review_responder_bash_denied, ppl/forges/github.py:bash_shapes"
deny_test = "tests/test_guard.py::TestGuard::test_github_review_responder_bash_is_an_allowlist, tests/test_guard.py::TestGuard::test_the_responder_may_not_run_gh_pr_view, tests/test_guard.py::TestGuard::test_the_responder_may_not_git_push, tests/test_guard.py::TestGuard::test_the_responder_may_not_pass_dash_c_to_git, tests/test_guard.py::TestGuard::test_gitlab_review_responder_has_no_bash_at_all, tests/test_guard.py::TestGuard::test_review_responder_redirect_into_a_file_is_denied, tests/test_guard.py::TestGuard::test_review_responder_redirect_glued_inside_a_rev_is_denied, tests/test_guard_tracker_cli.py::TestTrackerCliNoRole::test_the_review_responder_has_no_gh_issue_shape"
allow_test = "tests/test_guard.py::TestGuard::test_the_responder_may_git_diff_two_shas, tests/test_guard.py::TestGuard::test_the_responder_may_git_show_a_sha, tests/test_guard.py::TestGuard::test_review_responder_redirect_into_a_file_is_denied, tests/test_guard_tracker_cli.py::TestTrackerCliNoRole::test_a_role_keeps_its_own_commands"
owner = "guard-hook"
residual = "the shapes are git reads in a run repo the responder can reach, and git can still run a program a repo-local config names (core.fsmonitor, gpg through log.showSignature) or fetch lazily in a partial clone. That happens only inside the OS sandbox, where github.com is denied, so it cannot reach GitHub, and a run started with --no-os-sandbox or on Windows has no such cover"

[[rule]]
id = "R-GUARD-INTERNAL-ERROR-DENIES-ROLES"
statement = "When decide() raises, the hook denies the call for any role in boundary.ROLE_RULES (all six generated roles) instead of allowing it, and keeps allowing an unroled session so a hook defect cannot lock the operator out of unrelated sessions, except for a call that asks to run outside the OS sandbox."
scope = "every PreToolUse call carrying a role"
event = "exception inside decide"
enforcement = "blocking"
hook_or_check = "ppl/_assets/hooks/ppl_guard.py:main"
deny_test = "tests/test_guard.py::TestGuard::test_an_internal_error_denies_a_role_and_still_allows_an_unroled_session, tests/test_guard.py::TestGuard::test_an_internal_error_denies_every_generated_role, tests/test_guard.py::TestGuard::test_a_broken_stderr_does_not_undo_the_role_deny"
allow_test = ""
owner = "guard-hook"
residual = "an unroled orchestrator session is still fail-open on an internal error, by design, except for a call that asks to run outside the OS sandbox (R-OS-SANDBOX-FAIL-CLOSED)"

[[rule]]
id = "R-GUARD-ROLE-COMMAND-LENGTH"
statement = "A Bash command longer than 4096 characters from a ppl role in boundary.ROLE_RULES is denied before any pattern runs, so a padded command cannot outlast the hook's timeout for a role; an unroled session has no cap."
scope = "active or no run, a ppl role in boundary.ROLE_RULES"
event = "PreToolUse on Bash"
enforcement = "blocking"
