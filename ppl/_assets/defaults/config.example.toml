# Per-machine settings. Project settings live in a harness directory.

[setup]
version = 1
done = []
skipped = []

[claude]
binary = "claude"
workspace = ""
agents_dir = ""
skills_dir = ""
hooks = "local"

[models]
verify_ttl_days = 30

[harness]
active = ""

# The dollar cap per run, a number >= 0, copied into the run at ppl init, so a
# change applies to the next run. 0 is no cap. With a cap, ppl stage enter and
# ppl transition stop once the manual usd_used plus the priced usage reaches it,
# and a recorded model with no price below stops them too, since the cap cannot
# be computed. ppl park stays available. usd_max is the only key here: ppl init
# refuses any other, so a misspelt cap cannot leave a run uncapped.
[budgets]
usd_max = 0

# Dollar figures need prices. antline ships no built-in prices: it never states
# a cost it cannot source. A model with no price here is listed as unpriced.
# Use the exact model id and USD per million tokens, all four keys, numbers >= 0.
# ppl init copies this table into the run for the cap, so a price changed here
# counts toward the cap from the next run.
# [prices."claude-sonnet-5-5"]
# input = 3.0
# cache_write = 3.75
# cache_read = 0.3
# output = 15.0

# Thresholds and minimum samples of the ppl metrics warnings, for tuning them. The keys
# are <warning code in lower case>_threshold and <warning code in lower case>_min_sample,
# numbers >= 0, and any other key is refused. Defaults, threshold then minimum sample:
# verifier_never_reworks 1.0 and 10, high_incomplete_checks 0.25 and 8,
# retry_budget_often_spent 0.30 and 6, parks_one_cause 0.50 and 6, labels_missing 0.50
# and 6, format_refusals 2.0 and 5, cage_hits_high 5.0 and 5.
# [metrics]
# verifier_never_reworks_min_sample = 20
