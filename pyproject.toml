[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antline"
version = "0.1.0"
description = "Drive an issue through briefing, isolated implementation, independent tests, gates and review to an approved merge request, with Claude Code subagents in a cage."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{name = "Nomad06", email = "fortune06@yandex.ru"}]
dependencies = []

[project.scripts]
ppl = "ppl.cli:main"

[tool.setuptools]
packages = ["ppl", "ppl.panel", "ppl.forges", "ppl.trackers", "ppl.studio"]
include-package-data = true

[tool.setuptools.package-data]
"ppl.forges" = ["fragments/*/*.md"]
"ppl.trackers" = ["fragments/*/*.md"]
"ppl.panel" = ["index.html", "static/*", "static/*/*"]
